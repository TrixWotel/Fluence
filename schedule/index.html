<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schedule · Fluence</title>
  <meta name="description" content="Your week by the hour: your classes on the day they're on, your own blocks, and what's due, and today in order.">
  <script src="../settings.js"></script>
  <script src="../kit/look.js"></script>
  <script src="../kit/bar.js"></script>
  <script src="../kit/plan.js"></script>
  <script src="../kit/plan-day.js"></script>
  <script src="../kit/alerts.js"></script>
  <link rel="modulepreload" href="app.js">
  <link rel="modulepreload" href="../station/md.js">
  <link rel="stylesheet" href="../kit/site.css">
  <style>
    /* a workspace, laid out like Music: its tabs at the top, then the open view, with nothing boxed in */
    main.sc-main { width: 100%; max-width: 1180px; margin: 0 auto; padding: 26px 20px 48px; box-sizing: border-box; flex: 1; }
    .sc-none { margin: 0; color: var(--muted); }
    .sc-top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 22px; }
    .sc-tabs { display: flex; gap: 2px; max-width: 100%; padding: 3px; overflow-x: auto; background: color-mix(in srgb, var(--card) 55%, transparent); border: 1px solid var(--line); border-radius: 999px; scrollbar-width: none; }
    .sc-tabs a { display: inline-flex; align-items: center; gap: 7px; padding: 6px 14px; color: var(--muted); font-size: .93rem; font-weight: 550; text-decoration: none; white-space: nowrap; border-radius: 999px; transition: color var(--t1), background var(--t2); }
    .sc-tabs a:hover, .sc-tabs a.on { color: var(--text); }
    .sc-tabs a.on { background: var(--card); box-shadow: var(--shadow); }
    .sc-page { min-width: 0; }
    .sc-page.rise > * { animation: rise var(--t2) var(--ease) backwards; }

    /* a view's name, big, a line under it, and what it can do at the side */
    .sc-hero { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 14px; margin: 4px 0 24px; }
    .sc-hero h1 { margin: 0; font-size: clamp(1.9rem, 4.6vw, 2.8rem); line-height: 1.05; letter-spacing: -0.035em; }
    .sc-hero p { margin: 8px 0 0; color: var(--muted); font-size: 1.02rem; font-variant-numeric: tabular-nums; }
    .sc-hero .grow { flex: 1; }
    .btn.pill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; font-weight: 600; border-radius: 999px; }
    .btn.pill > svg { width: 16px; height: 16px; }
    .sc-nav { display: inline-flex; align-items: center; gap: 6px; }
    .sc-step { display: grid; place-items: center; width: 38px; height: 38px; padding: 0; font: inherit; font-size: 1.3rem; line-height: 1; color: var(--muted); cursor: pointer; background: none; border: 1px solid var(--line); border-radius: 999px; transition: color var(--t1), background var(--t1); }
    .sc-step:hover { color: var(--text); background: color-mix(in srgb, var(--text) 6%, transparent); }

    /* the week: its tools beside the tabs (its dates and Days, the weeks around it, Edit), and the calendar down to the
       player, so it all shows with nothing to scroll */
    .sc-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-left: auto; }
    .sc-range { margin: 0 6px 0 0; color: var(--muted); font-size: .98rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .sc-range b { color: var(--text); font-size: 1.2rem; font-weight: 650; letter-spacing: -0.01em; }
    main.sc-main.filled { padding-top: 6px; padding-bottom: 16px; }
    main.sc-main.filled .sc-top { margin-bottom: 6px; }
    main.sc-main.filled .sc-tabs a { padding: 4px 12px; font-size: .88rem; }
    main.sc-main.filled .sc-step { width: 30px; height: 30px; font-size: 1.1rem; }
    main.sc-main.filled .sc-tools .btn.pill { padding: 5px 13px; font-size: .9rem; }
    main.sc-main.filled .sc-range b { font-size: 1.05rem; }
    /* on the week the top row hides for the room: its key (or the handle in the calendar's corner) shows it, and Keep
       leaves it */
    main.sc-main.row-hidden .sc-top { display: none; }
    .cal-corner { display: flex; align-items: center; justify-content: center; min-width: 0; }
    .row-show { padding: 1px 7px; font: inherit; font-size: .7rem; line-height: 1.5; color: var(--muted); cursor: pointer; background: color-mix(in srgb, var(--text) 6%, transparent); border: 0; border-radius: 999px; opacity: .75; transition: opacity var(--t1), color var(--t1); }
    .row-show:hover, .row-show:focus-visible { opacity: 1; color: var(--text); outline: none; }
    .sc-keep, .sc-alerts { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; font: inherit; font-size: .86rem; font-weight: 600; color: var(--muted); cursor: pointer; background: none; border: 1px solid var(--line); border-radius: 999px; transition: color var(--t1), background var(--t1); }
    .sc-keep:hover, .sc-alerts:hover { color: var(--text); }
    .sc-keep svg, .sc-alerts svg { width: 15px; height: 15px; }
    .sc-keep[aria-pressed="true"] { color: var(--on-accent, #fff); background: var(--accent); border-color: var(--accent); }
    .sc-alerts[aria-pressed="true"] { color: var(--text); }
    /* a week on or back slides in from that side */
    .cal.slide-next > * { animation: sc-from-right .26s var(--ease) both; }
    .cal.slide-prev > * { animation: sc-from-left .26s var(--ease) both; }
    @keyframes sc-from-right { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
    @keyframes sc-from-left { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }

    /* "which Day is it": asked once, in place */
    .sc-ask { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 12px; margin: -6px 0 24px; font-size: 1rem; color: var(--muted); }
    .sc-ask b { color: var(--text); font-weight: 600; }
    .sc-ask .btn { padding: 6px 14px; font-size: .95rem; border-radius: 999px; }

    /* the calendar: the days across, the hours down, and only what matters on it */
    .cal { --axis: 56px; position: relative; }
    .cal-head, .cal-all, .cal-body { display: grid; grid-template-columns: var(--axis) repeat(var(--cols), minmax(0, 1fr)); column-gap: 8px; }
    .cal-dh { display: flex; justify-content: center; align-items: baseline; gap: 6px; min-width: 0; padding: 0 2px 2px; font: inherit; color: inherit; background: none; border: 0; border-radius: 10px; }
    button.cal-dh { cursor: pointer; }
    button.cal-dh:hover .wd { color: var(--text); }
    .cal-dh .wd { color: var(--muted); font-size: .76rem; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; }
    /* (every date in the same 30-pixel box, today's lit, so they all sit on one line) */
    .cal-dh .dn { display: inline-grid; place-items: center; height: 24px; font-size: 1.05rem; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
    .cal-dh .dn.label { font-size: 1.05rem; }
    .cal-dh.today .wd { color: var(--text); }
    .cal-dh.today .dn:not(.label) { min-width: 24px; padding: 0 5px; box-sizing: border-box; color: var(--on-accent, #fff); background: var(--accent); border-radius: 999px; }
    .cal-dh.today .dn.label { color: var(--accent); }
    .cal-all { margin-bottom: 4px; }
    .cal-ad { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .cal-chip { display: flex; align-items: center; min-width: 0; -webkit-user-select: none; user-select: none; padding: 1px 7px; font: inherit; font-size: .72rem; line-height: 1.25; text-align: left; color: var(--text); cursor: default; background: color-mix(in srgb, var(--c, var(--accent)) 18%, transparent); border: 0; border-radius: 8px; }
    .cal-chip > span { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .cal-chip.dl { --c: #e3a53d; font-weight: 600; }
    .cal-chip.off { --c: var(--muted); color: var(--muted); cursor: default; }
    .cal-chip.done { opacity: .42; }
    .cal-chip.day { --c: #d965a8; }
    .cal-body { position: relative; }
    .cal-hours { position: relative; }
    .cal-hours span { position: absolute; right: 6px; color: var(--muted); font-size: .74rem; line-height: 1; white-space: nowrap; font-variant-numeric: tabular-nums; transform: translateY(-50%); }
    .cal-hours span.first { transform: none; }
    .cal-col { position: relative; min-width: 0; }
    .cal-col.today { background-color: color-mix(in srgb, var(--accent) 3%, transparent); border-radius: 10px; }
    /* (a stretch nothing's in, folded away: a band of fine lines, and ⋯ by the hours) */
    .cal-fold { position: absolute; left: 0; right: 0; height: var(--gap); pointer-events: none; border-radius: 6px; background: repeating-linear-gradient(135deg, transparent 0 5px, color-mix(in srgb, var(--text) 6%, transparent) 5px 6px); }
    .cal-hours span.fold { transform: translateY(calc(var(--gap) / 2 - 50%)); letter-spacing: .12em; }
    /* (now, in the theme's color) */
    .cal-now { position: absolute; left: 0; right: 0; z-index: 0; height: 2px; margin-top: -1px; pointer-events: none; background: var(--accent); }
    .cal-dot { position: absolute; left: -6px; z-index: 5; width: 11px; height: 11px; margin-top: -5.5px; box-sizing: border-box; background: var(--accent); border: 2px solid var(--bg); border-radius: 50%; }

    /* a block: a class in its color, yours, or something set; a meal or the walk home, quieter. What's over is crossed
       off. Its name, and its times when there's room: small has its name and start on one line, tiny just its name */
    .cal-b { --c: color-mix(in srgb, var(--text) 50%, transparent); position: absolute; z-index: 1; left: calc(100% * var(--lane) / var(--of)); width: calc(100% / var(--of) - 3px); box-sizing: border-box; padding: 6px 9px; overflow: hidden; font-size: .82rem; line-height: 1.25; color: var(--text); cursor: default; background: color-mix(in srgb, var(--c) 20%, var(--bg)); border-radius: 8px; transition: background var(--t1), box-shadow var(--t1), opacity var(--t1); -webkit-user-select: none; user-select: none; }
    .cal-b:hover, .cal-b:focus-visible { z-index: 3; background: color-mix(in srgb, var(--c) 30%, var(--bg)); outline: none; }
    .cal-b > b { display: block; overflow: hidden; font-weight: 600; white-space: nowrap; text-overflow: ellipsis; }
    .cal-b > small { display: block; overflow: hidden; margin-top: 2px; color: color-mix(in srgb, var(--text) 58%, transparent); font-size: .74rem; white-space: nowrap; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
    .cal-b.small, .cal-b.tiny { display: flex; align-items: center; gap: 6px; padding: 0 8px; }
    .cal-b.small > b, .cal-b.tiny > b { flex: 0 1 auto; min-width: 0; }
    .cal-b.small > small { flex: none; margin: 0; }
    .cal-b.tiny > small { display: none; }
    .cal-b.tiny { font-size: .66rem; line-height: 1; border-radius: 5px; }
    .cal-b.bare { padding: 0; border-radius: 4px; }
    .cal-b.bare > * { display: none; }
    .cal-b.tall > b { display: -webkit-box; white-space: normal; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .cal-b.mine { --c: color-mix(in srgb, var(--text) 55%, transparent); }
    .cal-b.quiet, .cal-b.routine, .cal-b.sleep { color: color-mix(in srgb, var(--text) 75%, transparent); background: color-mix(in srgb, var(--text) 5%, var(--bg)); }
    .cal-b.quiet:hover, .cal-b.quiet:focus-visible, .cal-b.routine:hover, .cal-b.routine:focus-visible, .cal-b.sleep:hover, .cal-b.sleep:focus-visible { background: color-mix(in srgb, var(--text) 10%, var(--bg)); }
    .cal-b.quiet > b, .cal-b.routine > b, .cal-b.sleep > b { font-weight: 500; }
    .cal-b.done { opacity: .42; }
    .cal-b.now { z-index: 2; box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--accent) 70%, transparent); }
    /* crossing off: a line drawn through the name, left to right, as it fades; undoing takes it back the same way */
    .cal-b > b > span, .ag-name b > span, .cal-chip > span { background: linear-gradient(currentColor, currentColor) no-repeat 0 55% / 0 1.5px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
    .cal-b.done > b > span, .ag-row.done .ag-name b > span, .cal-chip.done > span { background-size: 100% 1.5px; }
    .cal-b.crossing > b > span, .ag-row.crossing .ag-name b > span, .cal-chip.crossing > span { animation: sc-strike .4s var(--ease) both; }
    .cal-b.crossing, .cal-chip.crossing { animation: sc-dim .5s ease both; }
    @keyframes sc-strike { from { background-size: 0 1.5px; } to { background-size: 100% 1.5px; } }
    @keyframes sc-dim { from { opacity: 1; } 40% { opacity: 1; } to { opacity: .42; } }
    /* (School, until Classes says which Day it is: pick it here) */
    .cal-b.asking { cursor: default; }
    .cal-b.asking:hover { background: color-mix(in srgb, var(--c) 20%, var(--bg)); }
    .cal-ask { display: grid; gap: 8px; margin-top: 14px; }
    .cal-ask p { margin: 0; font-size: .82rem; font-weight: 600; line-height: 1.35; white-space: normal; }
    .cal-ask p.why { color: color-mix(in srgb, var(--text) 62%, transparent); font-size: .76rem; font-weight: 400; }
    .cal-ask div { display: flex; flex-wrap: wrap; gap: 6px; }
    .cal-ask .btn { padding: 5px 12px; font-size: .8rem; border-radius: 999px; }
    [data-c="teal"] { --c: #2bb3a3; } [data-c="blue"] { --c: #4b8fdc; } [data-c="violet"] { --c: #8f74e0; }
    [data-c="purple"] { --c: #a45cc7; } [data-c="pink"] { --c: #d965a8; } [data-c="red"] { --c: #d45a50; }
    [data-c="orange"] { --c: #e38a3a; } [data-c="gold"] { --c: #d1aa36; } [data-c="olive"] { --c: #93a83c; }
    [data-c="green"] { --c: #49ae68; } [data-c="cyan"] { --c: #39b2d4; } [data-c="indigo"] { --c: #6676dc; }
    [data-c="brown"] { --c: #ad7d55; } [data-c="gray"] { --c: #8a8f98; }

    /* the card about a block: when, where, how, and Start or check it off */
    .cal-pop { position: fixed; z-index: 60; width: 320px; max-width: calc(100vw - 20px); box-sizing: border-box; padding: 16px 18px 18px; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 14px 44px rgba(0, 0, 0, .38); animation: rise var(--t2) var(--ease) backwards; }
    .cal-pop.sheet { left: 10px; right: 10px; bottom: 10px; width: auto; max-width: none; }
    .pop-top { display: flex; align-items: flex-start; gap: 10px; }
    .pop-top b { flex: 1; font-size: 1.15rem; font-weight: 650; line-height: 1.3; }
    .pop-x { display: grid; place-items: center; flex: none; width: 28px; height: 28px; margin: -4px -6px 0 0; padding: 0; color: var(--muted); cursor: pointer; background: none; border: 0; border-radius: 8px; }
    .pop-x:hover { color: var(--text); background: color-mix(in srgb, var(--text) 7%, transparent); }
    .pop-x svg { width: 16px; height: 16px; }
    .cal-pop p { margin: 6px 0 0; font-size: .95rem; line-height: 1.5; }
    .cal-pop .pop-when { margin-top: 2px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .cal-pop .pop-note { color: var(--muted); font-size: .88rem; }
    .cal-pop .pop-how { color: var(--muted); }
    .cal-pop .pop-how b { color: var(--text); font-weight: 600; }
    .cal-pop .pop-how a { color: var(--accent); }
    .pop-steps { margin: 8px 0 0; padding: 0; list-style: none; font-size: .95rem; line-height: 1.6; }
    .pop-steps time { display: inline-block; min-width: 3.3em; color: var(--muted); font-variant-numeric: tabular-nums; }
    .pop-act { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .pop-act .btn { padding: 8px 16px; font-size: .95rem; border-radius: 999px; }

    /* Today: what's on now, then the day in order, a row each (like Music's songs) */
    .sc-now { max-width: 760px; margin: 0 0 26px; }
    .sc-say { margin: 0; font-size: 1.45rem; font-weight: 600; line-height: 1.35; letter-spacing: -0.01em; text-wrap: balance; }
    .sc-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin-top: 16px; }
    .sc-how { flex: 1 1 280px; margin: 0; color: var(--muted); font-size: .98rem; line-height: 1.5; }
    .sc-how b { color: var(--text); font-weight: 600; }
    .sc-meta { margin: 14px 0 0; color: var(--muted); font-size: .96rem; }
    .sc-agenda { display: grid; gap: 2px; max-width: 760px; margin: 0; padding: 0; list-style: none; }
    .ag-row { position: relative; display: grid; grid-template-columns: 6.4em minmax(0, 1fr); align-items: center; gap: 16px; min-height: 60px; padding: 4px 12px 4px 16px; border-radius: 14px; transition: background var(--t1), opacity var(--t1); }
    .ag-row::before { content: ''; position: absolute; left: 4px; top: 14px; bottom: 14px; width: 3px; background: var(--c, transparent); border-radius: 3px; }
    .ag-row:hover { background: color-mix(in srgb, var(--text) 4%, transparent); }
    .ag-row.now { background: color-mix(in srgb, var(--accent) 10%, transparent); }
    .ag-row.over:not(:hover) { opacity: .45; }
    .ag-row time { color: var(--muted); font-size: .95rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .ag-name { display: grid; gap: 3px; min-width: 0; -webkit-user-select: none; user-select: none; padding: 0; font: inherit; text-align: left; color: inherit; cursor: default; background: none; border: 0; }
    .ag-name b { overflow: hidden; font-size: 1.05rem; font-weight: 600; white-space: nowrap; text-overflow: ellipsis; }
    .ag-name small { overflow: hidden; color: var(--muted); font-size: .88rem; white-space: nowrap; text-overflow: ellipsis; }
    .ag-row.done .ag-name b { color: var(--muted); }
    .sc-switches { display: flex; flex-wrap: wrap; gap: 8px; max-width: 760px; margin: 26px 0 0; }
    .sc-switches button { padding: 6px 14px; font: inherit; font-size: .9rem; color: var(--muted); cursor: pointer; background: none; border: 1px solid var(--line); border-radius: 999px; transition: color var(--t1), background var(--t1); }
    .sc-switches button:hover { color: var(--text); }
    .sc-switches button[aria-pressed="true"] { color: var(--on-accent, #fff); background: var(--accent); border-color: var(--accent); }
    .sc-later { max-width: 760px; margin: 20px 0 0; color: var(--muted); font-size: .96rem; line-height: 1.55; }
    .sc-later b { color: var(--text); font-weight: 600; }

    /* a day at a time, on a phone */
    .sc-days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin: -8px 0 16px; }
    .sc-days button { display: grid; justify-items: center; gap: 2px; padding: 8px 0 7px; font: inherit; color: var(--muted); cursor: pointer; background: none; border: 0; border-radius: 12px; transition: background var(--t1), color var(--t1); }
    .sc-days button b { font-size: .74rem; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; }
    .sc-days button span { font-size: 1.15rem; font-variant-numeric: tabular-nums; color: var(--text); }
    .sc-days button.today b { color: var(--accent); }
    .sc-days button[aria-selected="true"] { background: color-mix(in srgb, var(--accent) 13%, transparent); }

    /* Classes: each week of your school's days */
    .sc-wide { margin: 0 0 28px; }

    /* Deadlines: what's coming, soonest first, each checked off where it is */
    .sc-dl { display: grid; gap: 2px; max-width: 760px; margin: 0; padding: 0; list-style: none; }
    .sc-dl li { display: grid; grid-template-columns: 30px 7.4em minmax(0, 1fr) auto; align-items: center; gap: 6px 12px; min-height: 52px; padding: 4px 12px 4px 6px; border-radius: 14px; }
    .sc-dl li:hover { background: color-mix(in srgb, var(--text) 4%, transparent); }
    .sc-dl time { color: var(--muted); font-size: .95rem; font-variant-numeric: tabular-nums; }
    .sc-dl .what { min-width: 0; font-size: 1.02rem; line-height: 1.35; overflow-wrap: anywhere; }
    .sc-dl small { color: var(--muted); font-size: .9rem; white-space: nowrap; }
    .sc-dl li.soon > small { color: var(--text); font-weight: 600; }
    .sc-dl li.done .what { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 55%, transparent); }
    .sc-past { max-width: 760px; margin-top: 22px; }
    .sc-past summary { padding: 4px 6px; color: var(--muted); cursor: pointer; }
    .sc-past[open] summary { margin-bottom: 6px; }
    .sc-nothing { margin: 8px 4px; color: var(--muted); }

    /* Pages: the rest of your plan, a row each */
    .sc-pages { display: grid; gap: 2px; max-width: 760px; margin: 0; padding: 0; list-style: none; }
    .sc-pages a { display: grid; gap: 3px; padding: 12px 16px; color: var(--text); text-decoration: none; border-radius: 14px; transition: background var(--t1); }
    .sc-pages a:hover { background: color-mix(in srgb, var(--text) 4%, transparent); }
    .sc-pages b { font-size: 1.08rem; font-weight: 600; }
    .sc-pages small { overflow: hidden; color: var(--muted); font-size: .92rem; white-space: nowrap; text-overflow: ellipsis; }

    /* a page, laid out (Station's Markdown) */
    .sc-md { max-width: 760px; font-size: 1.08rem; line-height: 1.65; }
    .sc-md > :first-child { margin-top: 0; }
    .sc-md p { margin: .4em 0; }
    .sc-md h1, .sc-md h2, .sc-md h3, .sc-md h4 { margin: 1.1em 0 .25em; font-weight: 650; line-height: 1.3; letter-spacing: -0.01em; }
    .sc-md h1 { font-size: 1.5rem; } .sc-md h2 { font-size: 1.3rem; } .sc-md h3 { font-size: 1.15rem; } .sc-md h4 { font-size: 1.05rem; }
    .sc-md ul, .sc-md ol { margin: .35em 0; padding-left: 1.5em; }
    .sc-md li { margin: .12em 0; }
    .sc-md li.task { position: relative; list-style: none; margin-left: -1.5em; padding-left: 1.75em; }
    .sc-md li.task > input { position: absolute; left: .1em; top: .36em; width: 17px; height: 17px; margin: 0; cursor: pointer; accent-color: var(--accent); }
    .sc-md li.task.done > span { color: var(--muted); text-decoration: line-through; }
    .sc-md a.wiki { color: var(--accent); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); }
    .sc-md .wiki.missing { color: var(--muted); border-bottom: 1px dashed color-mix(in srgb, var(--muted) 70%, transparent); }
    .sc-md a.ext { color: var(--accent); text-underline-offset: 2px; }
    .sc-md code { padding: 1px 5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .88em; background: color-mix(in srgb, var(--text) 7%, transparent); border-radius: 5px; }
    .sc-md pre { padding: 12px 14px; overflow: auto; background: color-mix(in srgb, var(--text) 6%, transparent); border-radius: 10px; }
    .sc-md pre code { padding: 0; background: none; }
    .sc-md blockquote { margin: .5em 0; padding: 1px 14px; color: var(--muted); border-left: 3px solid color-mix(in srgb, var(--accent) 50%, var(--line)); }
    .sc-md .tbl { margin: .5em 0; overflow-x: auto; }
    .sc-md table { width: 100%; font-size: 1.02rem; line-height: 1.5; border-collapse: collapse; }
    .sc-md th, .sc-md td { padding: 8px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
    .sc-md th { font-weight: 650; color: var(--muted); }
    .sc-md tr.now td { background: color-mix(in srgb, var(--accent) 12%, transparent); }
    .sc-md hr { margin: 1em 0; border: 0; border-top: 1px solid var(--line); }
    .sc-md mark { color: inherit; background: color-mix(in srgb, #ffd43b 45%, transparent); border-radius: 3px; padding: 0 2px; }

    /* changing a page: its Markdown, kept as you type */
    .sc-help { max-width: 760px; margin: -8px 0 14px; color: var(--muted); font-size: .98rem; line-height: 1.55; }
    .sc-help code { padding: 1px 5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9em; color: var(--text); background: color-mix(in srgb, var(--text) 7%, transparent); border-radius: 5px; }
    .sc-text { display: block; width: 100%; max-width: 860px; min-height: 320px; box-sizing: border-box; padding: 14px 16px; font: inherit; font-size: 1.04rem; line-height: 1.6; color: var(--text); resize: vertical; background: color-mix(in srgb, var(--text) 3%, transparent); border: 1px solid var(--line); border-radius: 14px; tab-size: 2; }
    .sc-text:focus { outline: none; border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); background: var(--card); }
    .sc-saved { color: var(--muted); font-size: .92rem; }
    .sc-foot { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; margin-top: 14px; }
    .sc-del { padding: 4px 2px; font: inherit; font-size: .94rem; color: var(--muted); cursor: pointer; background: none; border: 0; }
    .sc-del:hover { color: var(--bad); text-decoration: underline; }
    .sc-sure { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }

    /* nothing yet */
    .sc-empty { display: grid; justify-items: start; gap: 12px; max-width: 560px; }
    .sc-empty h2 { margin: 0; font-size: clamp(1.7rem, 4vw, 2.4rem); font-weight: 650; letter-spacing: -0.03em; }
    .sc-empty p { margin: 0; color: var(--muted); font-size: 1.05rem; line-height: 1.55; }
    .sc-empty .btn { border-radius: 999px; }

    /* a phone */
    @media (max-width: 760px) {
      main.sc-main { padding: 16px 12px 30px; }
      .sc-top { margin-bottom: 16px; }
      .sc-hero { margin-bottom: 18px; }
      .sc-say { font-size: 1.2rem; }
      .cal { --axis: 44px; }
      .cal-b { font-size: .88rem; }
      .sc-tools { margin-left: 0; }
      .sc-range .days { display: none; }
      .sc-wide { overflow-x: auto; }
      .sc-wide .cal { min-width: 620px; }
      .ag-row { grid-template-columns: 5.4em minmax(0, 1fr); gap: 10px; padding-left: 12px; }
      .sc-dl li { grid-template-columns: 26px 5.6em minmax(0, 1fr); }
      .sc-dl li small { grid-column: 3; margin-top: -6px; }
    }
  </style>
</head>

  <main class="sc-main">
    <div id="sc" class="sc"><noscript><p class="sc-none">Schedule needs JavaScript.</p></noscript></div>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
