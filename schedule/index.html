<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schedule · Fluence</title>
  <meta name="description" content="Your plan: today in order with a check for each thing you do, your week, deadlines, lights out, and how to study.">
  <script src="../settings.js"></script>
  <script src="../kit/look.js"></script>
  <script src="../kit/bar.js"></script>
  <script src="../kit/plan.js"></script>
  <script src="../kit/plan-day.js"></script>
  <link rel="modulepreload" href="app.js">
  <link rel="modulepreload" href="../station/md.js">
  <link rel="stylesheet" href="../kit/site.css">
  <style>
    /* the heading, then the frame: your plan's pages on the left, the open one on the right */
    main.sc-main { width: 100%; max-width: 1180px; margin: 0 auto; padding: 40px 20px 48px; box-sizing: border-box; flex: 1; }
    .sc-head > * { animation: rise var(--t3) var(--ease) backwards; }
    .sc-head > :nth-child(2) { animation-delay: calc(60ms / var(--speed)); }
    .sc-head h1 { font-size: 2.4rem; line-height: 1.15; letter-spacing: -0.025em; margin: 0 0 8px; }
    .sc-head .lead { color: var(--muted); font-size: 1.1rem; margin: 0 0 22px; max-width: 70ch; }
    .sc { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 540px; background: var(--card); border: 1px solid var(--line); border-radius: calc(var(--radius) + 6px); overflow: hidden; animation: rise var(--t3) var(--ease) backwards; animation-delay: calc(120ms / var(--speed)); }
    .sc-none { margin: 0; padding: 28px; color: var(--muted); }

    /* the left: Today and your pages, one lit */
    .sc-side { display: flex; flex-direction: column; gap: 4px; padding: 16px 10px; background: color-mix(in srgb, var(--bg) 62%, var(--card)); border-right: 1px solid var(--line); }
    .sc-list { display: flex; flex-direction: column; gap: 1px; }
    .sc-row { display: flex; align-items: center; gap: 10px; min-height: 38px; padding: 2px 10px; font-size: 1.02rem; color: var(--text); text-decoration: none; border-radius: 9px; transition: background var(--t1); }
    .sc-row:hover { background: color-mix(in srgb, var(--text) 6%, transparent); }
    .sc-row.on { background: color-mix(in srgb, var(--accent) 12%, transparent); }
    .sc-row > svg { flex: none; width: 17px; height: 17px; color: var(--muted); }
    .sc-row.on > svg, .sc-row.today > svg { color: var(--accent); }
    .sc-label { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .sc-row small { color: var(--muted); font-size: .88rem; font-variant-numeric: tabular-nums; }
    .sc-new { display: flex; align-items: center; gap: 10px; min-height: 36px; margin-top: 6px; padding: 2px 10px; color: var(--muted); font-size: .96rem; text-decoration: none; border-radius: 9px; }
    .sc-new:hover { color: var(--text); background: color-mix(in srgb, var(--text) 6%, transparent); }
    .sc-new > svg { width: 16px; height: 16px; }

    /* the right: the open page */
    .sc-page { min-width: 0; padding: 30px 40px 36px; }
    .sc-page > * { max-width: 760px; }
    .sc-page.rise > * { animation: rise var(--t2) var(--ease) backwards; }
    .sc-top { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px; margin-bottom: 14px; }
    .sc-top h2 { margin: 0; font-size: 1.75rem; font-weight: 650; line-height: 1.2; letter-spacing: -0.015em; }
    .sc-top .grow { flex: 1; }
    .sc-top .btn { padding: 6px 14px; font-size: .95rem; }
    .sc-muted { color: var(--muted); }

    /* Today: what's on now, its way in, and the day */
    .sc-now { margin: 0 0 14px; font-size: 1.5rem; font-weight: 600; line-height: 1.35; letter-spacing: -0.01em; text-wrap: balance; }
    .sc-act { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 16px; margin: 0 0 20px; }
    .sc-act .btn { padding: 9px 18px; font-weight: 600; }
    .sc-how { flex: 1 1 260px; margin: 0; color: var(--muted); font-size: 1rem; line-height: 1.5; }
    .sc-how b { color: var(--text); font-weight: 600; }
    .sc .plan-day { margin: 0; padding: 0; background: none; border: 0; animation: none; }
    .sc-later { margin: 18px 0 0; padding: 0 4px; color: var(--muted); font-size: .98rem; line-height: 1.55; }
    .sc-later b { color: var(--text); font-weight: 600; }

    /* Week: a day of it at a time */
    .sc-range { color: var(--muted); font-size: 1rem; font-variant-numeric: tabular-nums; }
    .sc-step { display: grid; place-items: center; width: 34px; height: 34px; padding: 0; font: inherit; font-size: 1.2rem; line-height: 1; color: var(--muted); cursor: pointer; background: none; border: 0; border-radius: 9px; }
    .sc-step:hover { color: var(--text); background: color-mix(in srgb, var(--text) 7%, transparent); }
    .sc-days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin: 0 0 16px; }
    .sc-days button { display: grid; justify-items: center; gap: 1px; padding: 8px 0 7px; font: inherit; color: var(--muted); cursor: pointer; background: none; border: 0; border-radius: 10px; transition: background var(--t1), color var(--t1); }
    .sc-days button b { font-size: .86rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
    .sc-days button span { font-size: 1.15rem; font-variant-numeric: tabular-nums; color: var(--text); }
    .sc-days button:hover { background: color-mix(in srgb, var(--text) 6%, transparent); }
    .sc-days button.today b { color: var(--accent); }
    .sc-days button[aria-selected="true"] { background: color-mix(in srgb, var(--accent) 13%, transparent); }
    .pd-ring { justify-self: center; width: 12px; height: 12px; box-sizing: border-box; border: 1.5px solid color-mix(in srgb, var(--muted) 70%, transparent); border-radius: 50%; }
    .sc-tag { padding: 1px 8px; color: var(--muted); font-size: .8rem; border: 1px solid var(--line); border-radius: 999px; }
    .sc-nothing { margin: 8px 4px; color: var(--muted); }

    /* Deadlines: what's coming, soonest first, each checked off where it is */
    .sc-dl { display: grid; gap: 1px; margin: 0; padding: 0; list-style: none; }
    .sc-dl li { display: grid; grid-template-columns: 26px 7.4em minmax(0, 1fr) auto; align-items: center; gap: 6px 10px; min-height: 40px; padding: 3px 8px 3px 4px; border-radius: 10px; }
    .sc-dl li:hover { background: color-mix(in srgb, var(--text) 3%, transparent); }
    .sc-dl time { color: var(--muted); font-size: .95rem; font-variant-numeric: tabular-nums; }
    .sc-dl .what { min-width: 0; overflow-wrap: anywhere; line-height: 1.35; }
    .sc-dl small { color: var(--muted); font-size: .9rem; white-space: nowrap; }
    .sc-dl li.soon small { color: var(--text); font-weight: 600; }
    .sc-dl li.done .what { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 55%, transparent); }
    .sc-past { margin-top: 20px; }
    .sc-past summary { padding: 4px; color: var(--muted); cursor: pointer; }
    .sc-past[open] summary { margin-bottom: 6px; }
    .sc-tonight { margin: 0 0 18px; font-size: 1.15rem; }
    .sc-gap { height: 14px; }

    /* a page, laid out (Station's Markdown) */
    .sc-md { font-size: 1.08rem; line-height: 1.65; }
    .sc-md > :first-child { margin-top: 0; }
    .sc-md p { margin: .4em 0; }
    .sc-md h1, .sc-md h2, .sc-md h3, .sc-md h4 { margin: 1.1em 0 .25em; font-weight: 650; line-height: 1.3; letter-spacing: -0.01em; }
    .sc-md h1 { font-size: 1.5rem; } .sc-md h2 { font-size: 1.3rem; } .sc-md h3 { font-size: 1.15rem; } .sc-md h4 { font-size: 1.05rem; }
    .sc-md ul, .sc-md ol { margin: .35em 0; padding-left: 1.5em; }
    .sc-md li { margin: .12em 0; }
    .sc-md li.task { position: relative; list-style: none; margin-left: -1.5em; padding-left: 1.75em; }
    .sc-md li.task > input { position: absolute; left: .1em; top: .36em; width: 17px; height: 17px; margin: 0; cursor: pointer; accent-color: var(--accent); }
    .sc-md li.task.done > span { color: var(--muted); text-decoration: line-through; }
    .sc-md a.wiki { color: var(--accent); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); }
    .sc-md .wiki.missing { color: var(--muted); border-bottom: 1px dashed color-mix(in srgb, var(--muted) 70%, transparent); }
    .sc-md a.ext { color: var(--accent); text-underline-offset: 2px; }
    .sc-md code { padding: 1px 5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .88em; background: color-mix(in srgb, var(--text) 7%, transparent); border-radius: 5px; }
    .sc-md pre { padding: 12px 14px; overflow: auto; background: color-mix(in srgb, var(--text) 6%, transparent); border-radius: 10px; }
    .sc-md pre code { padding: 0; background: none; }
    .sc-md blockquote { margin: .5em 0; padding: 1px 14px; color: var(--muted); border-left: 3px solid color-mix(in srgb, var(--accent) 50%, var(--line)); }
    .sc-md .tbl { margin: .5em 0; overflow-x: auto; }
    .sc-md table { width: 100%; font-size: 1.02rem; line-height: 1.5; border-collapse: collapse; }
    .sc-md th, .sc-md td { padding: 8px 12px; text-align: left; vertical-align: top; border: 1px solid var(--line); }
    .sc-md th { font-weight: 650; background: color-mix(in srgb, var(--text) 4%, transparent); }
    .sc-md tr.now td { background: color-mix(in srgb, var(--accent) 12%, transparent); }
    .sc-md hr { margin: 1em 0; border: 0; border-top: 1px solid var(--line); }
    .sc-md mark { color: inherit; background: color-mix(in srgb, #ffd43b 45%, transparent); border-radius: 3px; padding: 0 2px; }

    /* changing a page: its Markdown, kept as you type */
    .sc-help { margin: -4px 0 12px; color: var(--muted); font-size: .98rem; line-height: 1.55; }
    .sc-help code { padding: 1px 5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9em; color: var(--text); background: color-mix(in srgb, var(--text) 7%, transparent); border-radius: 5px; }
    .sc-text { display: block; width: 100%; min-height: 320px; box-sizing: border-box; padding: 14px 16px; font: inherit; font-size: 1.04rem; line-height: 1.6; color: var(--text); resize: vertical; background: color-mix(in srgb, var(--text) 3%, transparent); border: 1px solid var(--line); border-radius: 12px; tab-size: 2; }
    .sc-text:focus { outline: none; border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); background: var(--card); }
    .sc-saved { color: var(--muted); font-size: .92rem; }
    .sc-foot { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; margin-top: 14px; }
    .sc-del { padding: 4px 2px; font: inherit; font-size: .94rem; color: var(--muted); cursor: pointer; background: none; border: 0; }
    .sc-del:hover { color: var(--bad); text-decoration: underline; }
    .sc-sure { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }

    /* nothing yet */
    .sc-empty { display: grid; justify-items: start; gap: 12px; max-width: 560px; }
    .sc-empty h2 { margin: 0; font-size: 1.6rem; font-weight: 650; }
    .sc-empty p { margin: 0; color: var(--muted); font-size: 1.05rem; line-height: 1.55; }

    /* a phone: the pages go across the top */
    @media (max-width: 760px) {
      main.sc-main { padding: 26px 12px 32px; }
      .sc-head h1 { font-size: 2rem; }
      .sc { grid-template-columns: minmax(0, 1fr); min-height: 0; }
      .sc-side { flex-direction: row; align-items: center; gap: 4px; padding: 8px; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); scrollbar-width: none; }
      .sc-list { flex-direction: row; gap: 4px; }
      .sc-row, .sc-new { flex: none; min-height: 36px; margin: 0; padding: 2px 12px; white-space: nowrap; }
      .sc-row > svg, .sc-new > svg { display: none; }
      .sc-label { overflow: visible; }
      .sc-page { padding: 20px 14px 26px; }
      .sc-top h2 { font-size: 1.45rem; }
      .sc-now { font-size: 1.25rem; }
      .sc-days button { padding: 7px 0 6px; }
      .sc-days button b { font-size: .74rem; letter-spacing: .02em; }
      .sc-dl li { grid-template-columns: 24px 5.6em minmax(0, 1fr); }
      .sc-dl li small { grid-column: 3; margin-top: -6px; }
    }
  </style>
</head>
<body data-title="Schedule">
  <script>window.fluentio?.bar?.()</script>
  <main class="sc-main">
    <header class="sc-head" id="top">
      <h1>🗓️ <span data-fill="scheduleTitle">Schedule</span></h1>
      <p class="lead">Today in order, with a check for each thing you do. Your week, your deadlines and when it’s lights out are pages here, and they’re yours to change.</p>
    </header>
    <div id="sc" class="sc"><noscript><p class="sc-none">Schedule needs JavaScript.</p></noscript></div>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
