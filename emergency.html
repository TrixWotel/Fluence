<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AMC 10 in One Day · Fluence</title>
  <meta name="robots" content="noindex">
  <!-- temporary: after November 4, 2026 this page is gone, and .github/workflows/emergency.yml on the space branch deletes it -->
  <script>if (Date.now() >= new Date(2026, 10, 5)) { try { localStorage.removeItem('fluentio:emergency'); } catch {} location.replace('./'); }</script>
  <script src="../settings.js"></script>
  <script src="../kit/look.js"></script>
  <script src="../kit/bar.js"></script>
  <link rel="stylesheet" href="../kit/site.css">
  <link rel="stylesheet" href="../kit/tests.css">
  <style>
    .small { font-size: .9rem; margin: 6px 0 12px; }
    .today { display: inline-block; margin: 0 0 18px; padding: 4px 12px; border-radius: 999px; font-size: .88rem; font-weight: 600; color: var(--bad); border: 1px solid color-mix(in srgb, var(--bad) 45%, var(--line)); background: color-mix(in srgb, var(--bad) 8%, transparent); }
    .bar-wrap { height: 8px; border-radius: 4px; overflow: hidden; background: color-mix(in srgb, var(--line) 85%, transparent); }
    .bar-wrap div { height: 100%; border-radius: inherit; background: var(--accent); transition: width var(--t3) var(--ease); }
    .blocks { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 26px; }
    .blocks a { padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); text-decoration: none; font-size: .9rem; transition: border-color var(--t1), color var(--t1); }
    .blocks a:hover { border-color: var(--accent); color: var(--text); }
    .blocks a.on { background: var(--soft); border-color: var(--accent); color: var(--text); font-weight: 600; }
    .blocks a.done:not(.on) { color: var(--good); }
    .block h2 { font-size: 1.7rem; letter-spacing: -0.015em; margin: 0 0 6px; }
    .block h3 { text-transform: none; letter-spacing: -0.005em; color: var(--text); }
    .part { font-size: 1.2rem; margin: 30px 0 8px; }
    .knows { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 12px; margin-top: 14px; }
    .know { padding: 14px 16px; background: var(--card); border: 1px solid var(--line); border-radius: calc(var(--radius) + 2px); }
    .know.star { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
    .know h3 { margin: 0 0 6px; font-size: 1.02rem; }
    .know p { margin: 0; }
    .know .ex { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); color: var(--muted); font-size: .94rem; }
    .goals { width: 100%; border-collapse: collapse; margin: 14px 0; font-size: .96rem; }
    .goals th, .goals td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: right; }
    .goals th:first-child, .goals td:first-child { text-align: left; }
    .goals th { color: var(--muted); font-weight: 600; }
    .goals .you { background: var(--soft); }
    .goals .goal td { color: var(--good); font-weight: 600; }
    .calc { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin: 0 0 18px; }
    .calc .input { width: 72px; margin-left: 4px; }
    .calc-out { margin: 0; }
    .tally { font-weight: 600; color: var(--accent); margin: 0 0 12px; }
    .drills { display: grid; gap: 14px; }
    .row-end { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .row-end.next { margin-top: 28px; justify-content: flex-end; }
    .steps-list { margin: 14px 0; padding-left: 22px; display: grid; gap: 6px; }
  </style>
</head>
<body data-title="AMC 10 in One Day">
  <script>window.fluentio?.bar?.()</script>
  <main>
    <header>
      <a class="back" href="./">← Math Tests</a>
      <h1>🚨 AMC 10 in One Day</h1>
      <p class="lead small">Built around your mock: 13 right, 4 wrong, 8 blank, which is 90 points. The goal is 103.5.</p>
      <p class="today" id="left">Today only. This lesson deletes itself at midnight.</p>
    </header>
    <div id="app"><noscript>This lesson needs JavaScript.</noscript></div>
  </main>
  <script type="module" src="emergency.js"></script>
</body>
</html>
