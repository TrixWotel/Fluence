<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>History · Fluence</title>
  <meta name="description" content="The Middle Ages, the Wars of Religion and American history to the end of the Cold War, in short stories where you make the choices, with notes, practice and tests.">
  <script src="../settings.js"></script>
  <script src="../kit/look.js"></script>
  <script src="../kit/bar.js"></script>
  <link rel="stylesheet" href="../kit/site.css">
  <link rel="stylesheet" href="../kit/tests.css">
  <link rel="stylesheet" href="chapters.css">
</head>
<body data-title="History">
  <script>window.fluentio?.bar?.()</script>
  <main>
    <header id="top">
      <a class="back" href="../study/">← <span data-fill="studyTitle">Study</span></a>
      <h1>🏰 History</h1>
      <p class="lead">Read through it as a story: you make the choices people really faced, then try out what you’ve learned in each chapter.</p>
      <div id="chapters"></div>
      <h2 class="tests-title">Notes, practice and tests</h2>
    </header>
    <div id="app"><noscript>These tests need JavaScript.</noscript></div>
  </main>
  <script type="module">
    import { testsPage } from '../kit/tests.js';
    import { middleAges } from './middle-ages.js';
    import { middleAgesLearning, timeline } from './middle-ages-lessons.js';
    import { middleAgesExam } from './middle-ages-exam.js';
    import { warsOfReligion } from './wars-of-religion.js';
    import { warsLearning, warsTimeline } from './wars-of-religion-lessons.js';
    import { warsExam } from './wars-of-religion-exam.js';
    import { usHistory } from './us-history.js';
    import { usLearning, usTimeline } from './us-history-lessons.js';
    import { usExam } from './us-history-exam.js';
    import { chapterCards } from './chapters-home.js';

    chapterCards(document.getElementById('chapters'));

    testsPage({ tests: [
      {
        bank: middleAges, name: 'The Middle Ages', length: 20, learn: middleAgesLearning, exam: middleAgesExam, story: (k) => `chapters.html#middleages/${k}`,
        blurb: 'From the fall of Rome to the printing press: Charlemagne, the Vikings, feudalism, the Crusades, Magna Carta, the Black Death, the Hundred Years’ War, and the world beyond Europe. Tests like the ones in class, and practice.',
        about: 'Practice asks in many ways: myth or true, who am I from clues, sort onto two sides, put events in order, match people and words to what they were, choose all that fit, the odd one out, the year and the century, as well as choosing or typing an answer. A test like the ones in class has key words and dates, a source to read and question, and an answer to explain, which you mark yourself against the mark scheme. Learning goes in time order, in five units, each topic with a short lesson.',
        asideName: 'The timeline', aside: timeline,
      },
      {
        bank: warsOfReligion, name: 'The Wars of Religion', length: 20, learn: warsLearning, exam: warsExam, story: (k) => `chapters.html#wars/${k}`,
        blurb: 'From Luther’s protest to the Peace of Westphalia: the Huguenots, the St. Bartholomew’s Day Massacre, the Defenestration of Prague and the Thirty Years’ War. Tests like the ones in class, with made-up sources to question, and practice.',
        about: 'Practice asks in many ways: myth or true, who am I from clues, sort onto two sides, put events in order, match people and words to what they were, choose all that fit, the odd one out, the year and the century, as well as choosing or typing an answer. The tests like the ones in class add a source to question and an answer to explain.',
        asideName: 'The timeline', aside: warsTimeline,
      },
      {
        bank: usHistory, name: 'American History', length: 20, learn: usLearning, exam: usExam, story: (k) => `chapters.html#ushistory/${k}`,
        blurb: 'From the first peoples to the end of the Cold War: the colonies, the Revolution and the Constitution, westward growth, the Civil War and Reconstruction, the Gilded Age and the Progressives, two world wars and the Depression, civil rights, Vietnam and the fall of the Berlin Wall. Tests like the ones in class, with made-up sources to question, and practice.',
        about: 'Practice asks in many ways: myth or true, who am I from clues, sort onto two sides, put events in order, match people and words to what they were, choose all that fit, the odd one out, the year and the century, as well as choosing or typing an answer. A test like the ones in class has key words and dates, a source to read and question, and an answer to explain, which you mark yourself against the mark scheme. Learning goes in time order, in eight units, each topic with a short lesson, and each chapter tells its story.',
        asideName: 'The timeline', aside: usTimeline,
      },
    ] });
  </script>
</body>
</html>
