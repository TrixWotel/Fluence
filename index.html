<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Science Tests · Fluence</title>
  <meta name="description" content="Systems and matter, heat and energy, gases, the atmosphere and winds, and lab skills: learn a topic at a time with a short lesson, practise in many ways, and take tests.">
  <script src="../settings.js"></script>
  <script src="../kit/look.js"></script>
  <script src="../kit/bar.js"></script>
  <link rel="stylesheet" href="../kit/site.css">
  <link rel="stylesheet" href="../kit/tests.css">
</head>
<body data-title="Science Tests">
  <script>window.fluentio?.bar?.()</script>
  <main>
    <header id="top">
      <a class="back" href="../study/">← <span data-fill="studyTitle">Study</span></a>
      <h1>🧪 Science Tests</h1>
      <p class="lead">Systems and matter, heat and energy, gases, the atmosphere and winds, and lab skills: learn a topic at a time with a short lesson, practise any question, and take tests, with a mixed review of it all.</p>
    </header>
    <div id="app"><noscript>These tests need JavaScript.</noscript></div>
  </main>
  <script type="module">
    import { testsPage } from '../kit/tests.js';
    import { heat, MATERIALS } from './heat.js';
    import { heatLearning } from './heat-lessons.js';
    import { heatExam } from './heat-exam.js';
    import { systems } from './systems.js';
    import { systemsLearning, systemsAside } from './systems-lessons.js';
    import { energy } from './energy.js';
    import { energyLearning, energyAside } from './energy-lessons.js';
    import { earth } from './earth.js';
    import { earthLearning, earthAside } from './earth-lessons.js';
    import { labs } from './labs.js';
    import { labsLearning, labsAside } from './labs-lessons.js';
    import { review } from './review.js';

    // the formulas, next to the table of specific heats the questions use
    const formulas = () => {
      const box = document.createElement('div');
      box.className = 'cols';
      box.innerHTML = `<ul>
          <li><span class="f">Q = mcΔT</span>: heat (J) = mass (g) × specific heat × change in temperature (°C).</li>
          <li><span class="f">ΔT = final − initial</span>. Something that cools gives heat off.</li>
          <li>Mixing: heat lost by the hot thing = heat gained by the cold thing.</li>
          <li>A heater gives <span class="f">Q = P × t</span> (watts × seconds = joules).</li>
          <li>1 kJ = 1000 J, and 1 cal = 4.184 J.</li>
          <li>In J/(kg·°C) a specific heat is 1000 times bigger than in J/(g·°C).</li>
        </ul>
        <table class="data"><thead><tr><th>Material</th><th>c, J/(g·°C)</th></tr></thead><tbody>${
          MATERIALS.map(([name, c]) => `<tr><td>${name[0].toUpperCase() + name.slice(1)}</td><td>${c}</td></tr>`).join('')
        }</tbody></table>`;
      return box;
    };

    // (the sets of ideas: each asked in many ways, learned a topic at a time)
    const ABOUT = 'Practice asks in many ways: choosing, typing the word, true or false, matching words to what they mean, sorting onto two sides, putting steps in order, choosing all that fit, and numbers to work out. Learning goes a topic at a time, each with a short lesson, and a topic is learned after 4 right in a row.';
    testsPage({ tests: [
      {
        bank: systems, name: 'Systems and Matter', length: 20, learn: systemsLearning, about: ABOUT, asideName: 'Key facts', aside: systemsAside,
        blurb: 'Systems and feedback loops, open and closed systems, properties of matter and density, states and phase changes, mixtures, and measuring in the lab.',
      },
      {
        bank: energy, name: 'Energy and Matter', length: 20, learn: energyLearning, about: ABOUT, asideName: 'Key facts', aside: energyAside,
        blurb: 'Temperature, thermal energy and heat, specific heat, how land and water warm and cool, conduction, convection and radiation, and gases and the gas laws.',
      },
      {
        bank: heat, name: 'Heat Capacity: Q = mcΔT', length: 10, learn: heatLearning, exam: heatExam,
        blurb: 'Warming, cooling, mixing hot metal into water, heaters and calories.',
        about: 'Use Q = mcΔT to find the heat, the temperature change, the mass or the specific heat. Answers within 1% are right, so round as you like. The specific heats are in the table below.',
        asideName: 'Formulas and specific heats', aside: formulas, asideOpen: true,   // some questions ask which material in the table
      },
      {
        bank: earth, name: 'Earth and Energy Systems', length: 20, learn: earthLearning, about: ABOUT, asideName: 'Key facts', aside: earthAside,
        blurb: 'The atmosphere and its layers, air pressure, uneven heating, sea and land breezes, the global wind belts, the Coriolis effect and jet streams, and monsoons.',
      },
      {
        bank: review, name: 'Mixed Review', length: 30, about: 'Every topic of Systems and Matter, Energy and Matter and Earth and Energy Systems in one set, asked in all the same ways, so a test mixes them the way a test on all of it would. To learn a topic first, go to its own set.',
        blurb: 'Systems and Matter, Energy and Matter and Earth and Energy Systems, mixed in one test.',
      },
      {
        bank: labs, name: 'Investigations and Data', length: 20, learn: labsLearning, about: ABOUT, asideName: 'Key facts', aside: labsAside,
        blurb: 'Variables and fair tests, choosing and reading graphs, averages and errors, testing materials, insulation and design, and claims, evidence and reasoning.',
      },
    ] });
  </script>
</body>
</html>
