<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fluence</title>
  <meta name="description" content="My personal web playground: modules to study, and my own data, code and notes.">
  <script src="settings.js"></script>
  <script src="kit/look.js"></script>
  <script src="kit/bar.js"></script>
  <link rel="stylesheet" href="kit/site.css">
  <style>
    main { width: 100%; max-width: 1080px; margin: 0 auto; padding: clamp(14px, 4vh, 44px) 20px clamp(12px, 2.4vh, 24px); flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 0; }
    /* the whole home page in one screen, in the middle of the window: the welcome, then the tiles in one row, as tall as what's in them. In a
       window too short for them, the row shrinks to fit and a tile with more scrolls inside itself; a very short window
       scrolls as usual */
    @media (min-height: 540px) {
      html.home-fit body { height: 100svh; min-height: 0; }
      html.home-fit .bento { flex: 0 1 auto; min-height: 0; grid-auto-rows: minmax(0, 1fr); }
    }
    /* the words and buttons: the page stays in the middle of the window, and they sit along its left edge, in its middle or
       along its right edge (Settings → Home → Text). On the right, what's inside the tiles goes along, mirrored */
    main { --anchor: center; --anchor-text: center; }
    main.anchor-left { --anchor: flex-start; --anchor-text: left; }
    main.anchor-right { --anchor: flex-end; --anchor-text: right; }
    main.anchor-left .welcome { margin-left: 0; }
    main.anchor-right .welcome { margin-right: 0; }
    main.anchor-right .tile { text-align: right; }
    main.anchor-right .tile.music.feature { flex-direction: row-reverse; }
    main.anchor-right :is(.tile-head, .list a, .list li > span, .recent a, .m-tile-now, .m-mini button) { flex-direction: row-reverse; }
    main.anchor-right :is(.tile-go, .tile.music .m-bars) { margin-left: 0; margin-right: auto; }
    main.anchor-right .tile.music .m-bars + .tile-go { margin-left: 0; margin-right: 10px; }
    main.anchor-right :is(.list small, .recent small) { margin-left: 0; margin-right: auto; padding-left: 0; padding-right: 10px; }
    main.anchor-right :is(.list a, .recent a, .m-mini button):hover { transform: translateX(-3px); }
    main.anchor-right :is(.row, .chips, .qd-type, .m-btns, .qd-choice) { justify-content: flex-end; }
    main.anchor-right .tile.quick .row { align-items: flex-end; }
    main.anchor-right :is(.m-mini button, .qd-choice) { text-align: right; }
    .hero { text-align: var(--anchor-text); }
    .hero > * { animation: rise var(--t3) var(--ease) backwards; }
    .hello { margin: 0 0 4px; color: var(--text); font-size: clamp(1rem, 2.2vw, 1.15rem); font-weight: 650; letter-spacing: -0.01em; }
    .title-row { display: flex; flex-wrap: wrap; justify-content: var(--anchor); align-items: baseline; gap: 2px 14px; }
    .name {
      margin: 0; width: fit-content; font-size: clamp(1.9rem, min(5vw, 6vh), 2.7rem); line-height: 1.08; font-weight: 800; letter-spacing: -0.04em;
      background: linear-gradient(100deg, var(--text) 0 38%, var(--accent) 48%, var(--accent-2) 56%, var(--text) 66% 100%) 0 center / 200% auto;
      -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: rise var(--t3) var(--ease) backwards, shimmer calc(7s / var(--speed)) linear calc(1.2s / var(--speed)) infinite;
      animation-delay: calc(70ms / var(--speed)), calc(1.2s / var(--speed));
    }
    .lead { margin: 0; color: var(--muted); font-size: 1rem; animation-delay: calc(140ms / var(--speed)); }
    /* the welcome under the name: what the day and your progress say, and a way back to your topic */
    .welcome { margin: 8px auto 0; max-width: 70ch; font-size: 1rem; animation-delay: calc(210ms / var(--speed)); }
    .welcome a { margin-left: 6px; color: var(--accent); font-weight: 600; text-decoration: none; white-space: nowrap; }
    .welcome a:hover { text-decoration: underline; }
    html.flat .name { background: none; color: var(--text); animation: rise var(--t3) var(--ease) backwards; animation-delay: calc(70ms / var(--speed)); }

    /* the tiles: Recent tall on the left, Modules and Data beside it, Quick across under those */
    .bento { display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); grid-auto-flow: row dense; gap: 14px; margin-top: clamp(14px, 2.6vh, 26px); }
    .bento > * { animation-delay: calc((var(--n, 0) * 70ms + 200ms) / var(--speed)); }
    .tile {
      --c: var(--accent); display: flex; flex-direction: column; gap: 12px; min-width: 0; min-height: 0; overflow: auto; overscroll-behavior: contain; scrollbar-width: thin; padding: 18px 20px;
      background: color-mix(in srgb, var(--card) 86%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--line); border-radius: calc(var(--radius) + 6px); box-shadow: var(--shadow);
    }
    /* a tile can scroll, so the edge and the light that come in under the pointer stay inside it: a pixel outside, as on other cards, would be something to scroll to */
    .tile::before, .tile::after { inset: 0; border-radius: calc(var(--radius) + 5px); }
    .tile::before { padding: .5px; }
    .tile:active { transform: translateY(-3px); }
    .tile.big { grid-row: auto; }
    .tile.wide { grid-column: span 2; flex-direction: row; flex-wrap: wrap; align-items: center; }
    .tile p { margin: 0; }
    .tile-head { display: flex; align-items: center; gap: 12px; color: var(--text); text-decoration: none; font-weight: 650; font-size: 1.15rem; letter-spacing: -0.01em; }
    .tile-ic {
      width: 40px; height: 40px; flex: none; display: grid; place-items: center; border-radius: calc(var(--radius) * .8); color: var(--c);
      background: color-mix(in srgb, var(--c) 15%, var(--card)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 22%, transparent);
    }
    .tile-ic .i { width: 20px; height: 20px; }
    .tile:hover .tile-ic { animation: wiggle calc(.7s / var(--speed)) var(--ease); }
    .tile-go { margin-left: auto; display: grid; color: var(--muted); opacity: 0; transform: translateX(-6px); transition: opacity var(--t2), transform var(--t2) var(--spring), color var(--t1); }
    .tile:hover .tile-go { opacity: 1; transform: none; }
    .tile-head:hover .tile-go { color: var(--c); }
    .muted { color: var(--muted); }
    .small { font-size: .88rem; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; }
    .tile .btn { padding: 6px 12px; font-size: .92rem; }
    .tile .btn .i { width: 16px; height: 16px; }
    /* Recent: what you worked on last, in Data, Code or Notes */
    .recent { list-style: none; margin: 0 -8px; padding: 0; display: grid; gap: 2px; }
    .recent a { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: calc(var(--radius) * .6); color: var(--text); text-decoration: none; transition: background var(--t1), transform var(--t2) var(--ease); }
    .recent a:hover { background: color-mix(in srgb, var(--c) 10%, transparent); transform: translateX(3px); }
    .recent .i { color: var(--c); }
    .recent span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .recent small { margin-left: auto; padding-left: 10px; color: var(--muted); white-space: nowrap; }
    /* Modules: the topic to go on with, and how far along that test you are */
    .continue { display: grid; gap: 2px; color: var(--text); text-decoration: none; }
    .continue b { font-size: 1.12rem; transition: color var(--t1); }
    .continue:hover b { color: var(--c); }
    .meter { height: 8px; border-radius: 4px; overflow: hidden; background: color-mix(in srgb, var(--line) 85%, transparent); }
    .meter div { height: 100%; border-radius: inherit; background: var(--c); animation: fill calc(1s / var(--speed)) var(--ease) backwards; animation-delay: calc(.5s / var(--speed)); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: inherit; text-decoration: none; font-size: .9rem; transition: transform var(--t2) var(--spring), border-color var(--t1); }
    .chip:hover { transform: translateY(-2px); border-color: var(--k, var(--accent)); }
    /* Data: a bar for each sheet, as tall as it has rows */
    .bars { display: flex; align-items: flex-end; gap: 6px; height: 44px; }
    .bars span { width: 14px; border-radius: 4px 4px 2px 2px; background: var(--c); transform-origin: bottom; animation: grow-up calc(.7s / var(--speed)) var(--spring) backwards; animation-delay: calc((var(--n, 0) * 60ms + 450ms) / var(--speed)); }
    /* Your progress: three numbers, then each subject */
    .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .stat b { display: block; font-size: 1.7rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; color: var(--c); }
    .stat span { font-size: .8rem; color: var(--muted); }
    .list { list-style: none; margin: 0 -8px; padding: 0; display: grid; gap: 1px; }
    .list a, .list li > span { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: calc(var(--radius) * .6); color: var(--text); text-decoration: none; font-size: .94rem; transition: background var(--t1), transform var(--t2) var(--ease); }
    .list a:hover { background: color-mix(in srgb, var(--c) 10%, transparent); transform: translateX(3px); }
    .list small { margin-left: auto; padding-left: 10px; color: var(--muted); white-space: nowrap; }
    /* Today: the date, how far through the year, and what's coming */
    .date b { display: block; font-size: 1.7rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; }
    /* Question of the day: answer it right here */
    .tile.wide2 { grid-column: auto; }
    .qd-text { font-size: 1.06rem; }
    /* the columns are as wide as the longest answer (--w, measured below), so as many fit as can; one too long even for a whole row wraps */
    .qd-choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, var(--w, 84px)), 1fr)); gap: 6px; }
    .qd-choice span { min-width: 0; overflow-wrap: anywhere; }
    .qd-choice { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border: 1px solid var(--line); border-radius: calc(var(--radius) * .7); background: var(--bg); color: inherit; font: inherit; text-align: left; cursor: pointer; transition: border-color var(--t1), background var(--t2), transform var(--t2) var(--spring); }
    .qd-choice:hover:not(:disabled) { border-color: var(--c); transform: translateY(-1px); }
    .qd-choice:disabled { cursor: default; }
    .qd-choice b { color: var(--muted); font-weight: 600; }
    .qd-choice.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 12%, var(--bg)); animation: bump var(--t3) var(--spring); }
    .qd-choice.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, var(--bg)); animation: shake calc(.42s / var(--speed)) var(--ease); }
    .qd-type { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .qd-type .input { width: 180px; }
    .qd-result { font-weight: 600; min-height: 1.2em; }
    .qd-result.good { color: var(--good); } .qd-result.bad { color: var(--bad); }
    .qd-more { color: var(--c); font-weight: 600; text-decoration: none; }
    .qd-more:hover { text-decoration: underline; }
    .fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .9em; line-height: 1.15; margin: 0 .1em; }
    .fr > span:first-child { border-bottom: 1.5px solid currentColor; padding: 0 .2em; }
    /* Quick: the settings' buttons */
    .quick-label { display: flex; align-items: center; gap: 12px; margin-right: 6px; font-weight: 650; font-size: 1.05rem; }
    .tile.wide .row { margin-top: 0; }
    .tile.quick .row { flex-direction: column; align-items: flex-start; margin-top: 0; }
    /* Music: what's playing (with its controls), or your newest songs to start one */
    .tile.music .m-tile-now .m-art { --s: 76px; }
    .tile.music .row .btn { display: inline-flex; align-items: center; gap: 6px; }
    .tile.music .m-bars { margin-left: auto; }
    .tile.music .m-bars + .tile-go { margin-left: 10px; }
    .tile.music.feature { grid-column: span 2; flex-direction: row; flex-wrap: wrap; align-items: stretch; gap: 18px 28px; padding: 22px 24px;
      background: linear-gradient(120deg, color-mix(in srgb, var(--accent) 14%, var(--card)), color-mix(in srgb, var(--accent-2) 12%, var(--card)));
      box-shadow: var(--shadow), 0 0 calc(10px + var(--level) * 50px) calc(var(--level) * 8px) color-mix(in srgb, var(--accent) calc(var(--level) * 40%), transparent); }
    .tile.music.feature > .tile-head { flex: 1 0 100%; }
    .tile.music.feature > .now { flex: 1 1 340px; display: grid; gap: 10px; align-content: start; }
    .tile.music.feature > .side { flex: 1 1 260px; display: grid; gap: 8px; align-content: start; }
    .tile.music.feature .m-tile-now .m-art { --s: clamp(84px, 14vh, 132px); border-radius: 20px; }
    .tile.music.feature .m-tile-now b { font-size: 1.5rem; letter-spacing: -0.02em; }
    .tile.music .side h3 { margin: 0; font-size: .78rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
    /* the layouts: at night a big clock and quieter colors */
    .clock { margin: 0 0 2px; font-size: clamp(2.6rem, min(9vw, 9vh), 4.6rem); font-weight: 200; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums; color: var(--text); opacity: .9; }
    main.layout-calm .name { font-size: clamp(1.6rem, 4vw, 2.2rem); }
    main.layout-calm { max-width: 900px; }
    body.calm .sky i { opacity: calc(var(--sky) * .55); }
    /* under the tiles: the others, to swap in */
    .layouts { display: flex; flex-wrap: wrap; justify-content: var(--anchor); align-items: center; gap: 8px; margin-top: 12px; color: var(--muted); font-size: .86rem; animation: rise var(--t3) var(--ease) backwards; animation-delay: calc(600ms / var(--speed)); }
    .layouts .also { display: flex; flex-wrap: wrap; justify-content: var(--anchor); align-items: center; gap: 6px; }
    .layouts .chip { padding: 3px 10px; font: inherit; font-size: .86rem; cursor: pointer; }
    .layouts .chip .i { width: 14px; height: 14px; }
    @media (max-width: 560px) { .tile.music.feature, .tile.wide { grid-column: auto; } .welcome a { white-space: normal; } }
  </style>
</head>
<body>
  <script>window.fluentio?.bar?.()</script>
  <main>
    <header class="hero">
      <p class="clock" id="clock" hidden></p>
      <p class="hello" id="hello" hidden></p>
      <div class="title-row"><h1 class="name" id="name">Fluence</h1><p class="lead" id="tagline">Web stack workspace</p></div>
      <p class="welcome" id="welcome" hidden></p>
    </header>
    <section class="bento stagger" id="tiles" aria-label="Your spaces">
      <article class="card tile"><a class="tile-head" href="study/">📚 Modules</a><p class="muted">Tests, lessons and practice in five subjects.</p></article>
    </section>
    <div class="layouts" id="layouts"></div>
  </main>
  <script>
    // the home page from the settings (look.js has filled in what settings.js leaves out): the greeting, the name, and
    // the tiles in the layout's order. Recent shows what you worked on last (in Data, Code or Notes), Music what's playing
    // (or your newest songs), Modules the topic to go on with, Data your sheets, and Quick the settings' buttons.
    if (window.fluentio) {
      const f = window.fluentio, s = f.settings, { el, svg, link } = f, $ = (id) => document.getElementById(id);
      document.title = s.name;
      $('name').textContent = s.name;
      $('tagline').textContent = s.tagline;
      // your visits (one counts after half an hour away, so a reload keeps the welcome's words), topics learned and best
      // scores in every test, by subject, and the newest best (a test like the ones in class, practice or a test)
      const now = Date.now(), day = (t) => new Date(t).toDateString(), v = f.read('fluentio.visits') || {};
      const away = v.at ? Math.round((new Date(day(now)) - new Date(day(v.at))) / 86400000) : null;
      const fresh = !v.at || now - v.at > 30 * 60000;
      const visits = { count: (v.count || 0) + (fresh ? 1 : 0), streak: away === 0 ? v.streak || 1 : away === 1 ? (v.streak || 1) + 1 : 1, away: fresh ? away : v.away ?? null };
      f.write('fluentio.visits', { ...visits, at: now });
      const NAMES = { triangles: 'Triangle Angles', amc10: 'the AMC 10', amc12: 'the AMC 12', heat: 'Heat Capacity', kinematics: 'Kinematics', motion: 'Motion in a Straight Line', vectors: 'Vectors', projectiles: 'Projectile Motion', vocab: 'Vocabulary', preterite: 'the preterite', imperfect: 'the imperfect', middleages: 'the Middle Ages', wars: 'the Wars of Religion' };
      const IN = { math: ['triangles', 'amc10', 'amc12'], science: ['heat'], physics: ['kinematics', 'motion', 'vectors', 'projectiles'], spanish: ['vocab', 'preterite', 'imperfect'], history: ['middleages', 'wars'], geography: [] };
      const mine = {};   // id → { learned, bests }
      let learned = 0, bests = 0, best = null;
      for (const [id, name] of Object.entries(NAMES)) {
        const m = mine[id] = { learned: Object.values(f.read(`fluentio.${id}.learn`) || {}).filter((t) => t && t.learned).length, bests: 0 };
        learned += m.learned;
        for (const [key, what] of [['.exam', `the ${name} test`], ['.best', name], ['.best-hard', `${name} (harder)`], ['.best-mixed', `${name} (mixed)`]]) {
          const b = f.read(`fluentio.${id}${key}`);
          if (!b || !b.text) continue;
          m.bests++; bests++;
          if (b.when && (!best || b.when > best.at)) best = { test: what.replace(/^the the /, 'the '), text: b.text, at: b.when };
        }
      }
      const geo = Object.keys(f.read('fluentio.geo.best') || {}).length;
      bests += geo;
      const folderOf = (x) => String(x.link || '').replace(/^\.?\//, '').split('/')[0];
      const welcomed = f.wait(import(link('kit/welcome.js')));
      // your music, as this browser last saw it: what's playing (or was), and how many songs there are
      const tunes = f.read('fluentio.music.library') || {}, playing = f.read('fluentio.music.player') || {}, songs = Array.isArray(tunes.songs) ? tunes.songs : [];
      const on = songs.find((x) => x && x.id === (playing.queue || [])[playing.at]);
      const music = songs.length ? { title: on?.title || '', artist: on?.artist || '', playing: !!(on && playing.playing), songs: songs.length, liked: songs.filter((x) => x && x.liked).length } : null;
      if (s.greeting) {
        welcomed.then(({ welcome }) => {
          const w = welcome({ now: new Date(now), visits, last: f.last(), learned, best, name: s.name, music });
          $('hello').textContent = w.hello;
          $('hello').hidden = false;
          $('welcome').replaceChildren(w.line, w.link ? el('a', { href: link(w.link.href) }, `${w.link.text} →`) : '');
          $('welcome').hidden = false;
        }).catch(() => {});
      }
      const plural = (n, word) => `${n.toLocaleString('en-US')} ${word}${n === 1 ? '' : 's'}`;
      const ago = (t) => { const m = Math.round((Date.now() - (t || 0)) / 60000); return m < 1 ? 'now' : m < 60 ? `${m} min` : m < 1440 ? `${Math.round(m / 60)} h` : `${Math.round(m / 1440)} d`; };
      const items = f.workspace.items().sort((a, b) => (b.edited || 0) - (a.edited || 0));
      const ICON = { note: 'note', doc: 'doc', table: 'table', code: 'code' };
      const head = (icon, title, href) => el(href ? 'a' : 'div', { className: 'tile-head', href }, el('span', { className: 'tile-ic' }, svg(icon)), el('span', {}, title), href ? el('span', { className: 'tile-go' }, svg('arrow')) : null);
      const button = (title, href) => el('a', { className: 'btn', href }, svg('plus'), title);
      const tile = (cls, color, ...kids) => { const t = el('article', { className: `card tile ${cls}`.trim() }, ...kids); t.style.setProperty('--c', color); return t; };
      const html = (tag, cls, markup) => { const n = el(tag, { className: cls }); n.innerHTML = markup; return n; };   // (the banks' own markup)
      const midnight = (t) => { const d = new Date(t); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
      // the layout: Auto picks one for the time of day (study things in the morning, your tiles in the afternoon, music
      // in the evening and at weekends, and calm at night); Settings can fix one
      const LAYOUTS = { auto: null, classic: null, study: ['question', 'study', 'today', 'progress', 'music', 'quick'], music: ['music', 'study', 'question', 'today', 'progress', 'quick'], calm: ['music', 'today', 'quick'] };
      const hourNow = new Date(now).getHours(), weekend = [0, 6].includes(new Date(now).getDay());
      const autoLayout = hourNow >= 22 || hourNow < 5 ? 'calm' : hourNow < 11 ? 'study' : hourNow >= 17 || weekend ? 'music' : 'classic';
      const layout = s.homeLayout && LAYOUTS[s.homeLayout] && s.homeLayout !== 'auto' ? s.homeLayout : s.homeLayout === 'classic' ? 'classic' : autoLayout;
      const TILES = {
        workspace: () => tile('big', 'var(--accent-2)',
          head('clock', 'Recent'),
          items.length
            ? el('ul', { className: 'recent' }, items.slice(0, 6).map((it) => el('li', {}, el('a', { href: f.workspace.link(it) },
              svg(ICON[it.kind] || 'note'), el('span', {}, it.title || 'Untitled'), el('small', {}, ago(it.edited))))))
            : el('p', { className: 'muted' }, `What you work on in ${s.dataTitle}, ${s.codeTitle} and ${s.notesTitle} shows here. It’s all kept in this browser.`),
          el('div', { className: 'row' }, button('New note', link('notes/#new/note')), button('New file', link('code/#new/code')))),
        study: () => {
          const last = f.last(), done = last ? Math.max(0, last.learned || 0) : 0, of = last ? Math.max(1, last.total || 1) : 1;
          return tile('', 'var(--accent)', head('study', s.studyTitle, link('study/')), ...(last ? [
            el('a', { className: 'continue', href: last.href }, el('span', { className: 'muted small' }, 'Continue'), el('b', {}, last.topic || last.test || 'Learning')),
            el('div', { className: 'meter', role: 'img', 'aria-label': `${done} of ${of} topics learned` }, el('div', { style: `width:${Math.round((100 * done) / of)}%` })),
            el('p', { className: 'muted small' }, `${last.test ? last.test + ' · ' : ''}${done} of ${plural(of, 'topic')} learned`),
          ] : [
            el('p', { className: 'muted' }, 'Pick a subject to start.'),
            el('div', { className: 'chips' }, s.study.map((x) => {
              const chip = el('a', { className: 'chip', href: link(x.link) }, `${x.emoji || ''} ${x.title || ''}`.trim());
              if (x.color && CSS.supports('color', x.color)) chip.style.setProperty('--k', x.color);
              return chip;
            })),
          ]));
        },
        progress: () => {
          const stat = (n, one, many) => el('div', { className: 'stat' }, el('b', {}, n.toLocaleString('en-US')), el('span', {}, n === 1 ? one : many));
          return tile('', 'var(--good)', head('chart', 'Your progress'),
            el('div', { className: 'stats' }, stat(learned, 'topic learned', 'topics learned'), stat(visits.streak, 'day in a row', 'days in a row'), stat(bests, 'best score', 'best scores')),
            el('ul', { className: 'list' }, s.study.map((x) => {
              const ids = IN[folderOf(x)] || [], l = ids.reduce((n, id) => n + mine[id].learned, 0), b = ids.reduce((n, id) => n + mine[id].bests, 0) + (folderOf(x) === 'geography' ? geo : 0);
              const said = [l && `${l} learned`, b && plural(b, 'best')].filter(Boolean).join(' · ') || 'Not started';
              return el('li', {}, el('a', { href: link(x.link) }, el('span', {}, `${x.emoji || ''} ${x.title || ''}`.trim()), el('small', {}, said)));
            })));
        },
        today: () => {
          const d = new Date(now), start = new Date(d.getFullYear(), 0, 1), days = Math.round((midnight(now) - start) / 86400000) + 1;
          const of = new Date(d.getFullYear(), 1, 29).getMonth() === 1 ? 366 : 365, soon = el('ul', { className: 'list' });
          const when = (h) => { const n = h.days === 0 ? (h.left > 0 ? `through ${h.to.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}` : 'today') : h.days === 1 ? 'tomorrow' : `in ${h.days} days`; return h.off ? `off ${n}` : n; };
          welcomed.then(({ upcoming }) => soon.replaceChildren(...upcoming(d, 3, s.showDaysOff ? s.daysOff : []).map((h) => el('li', {}, el('span', {}, `${h.emoji} ${h.name}`, el('small', {}, when(h))))))).catch(() => {});
          return tile('', 'var(--accent-2)', head('calendar', d.toLocaleDateString('en-US', { weekday: 'long' })),
            el('div', { className: 'date' }, el('b', {}, d.toLocaleDateString('en-US', { month: 'long', day: 'numeric' })), el('span', { className: 'muted small' }, `Day ${days} of ${of}`)),
            el('div', { className: 'meter', role: 'img', 'aria-label': `Day ${days} of ${of}` }, el('div', { style: `width:${Math.round((100 * days) / of)}%` })),
            soon);
        },
        // one practice question a day, from a different subject each day (one without a figure, answered with a choice, a
        // number or a word), answered right here
        question: () => {
          const box = tile('wide2', 'var(--plot2)', head('spark', 'Question of the day'), el('p', { className: 'muted' }, 'Finding today’s question…'));
          const POOL = [['amc10', 'math/amc.js', 'amc'], ['heat', 'science/heat.js', 'heat'], ['vocab', 'spanish/vocab.js', 'vocab'], ['motion', 'physics/motion.js', 'motionBank'],
            ['amc10', 'math/amc.js', 'amc'], ['preterite', 'spanish/tenses.js', 'preteriteTest'], ['vectors', 'physics/vectors.js', 'vectorBank'], ['imperfect', 'spanish/tenses.js', 'imperfectTest'], ['middleages', 'history/middle-ages.js', 'middleAges']];
          const today = Math.round((midnight(now) - new Date(2026, 0, 1)) / 86400000), [id, file, name] = POOL[((today % POOL.length) + POOL.length) % POOL.length];
          const folder = file.split('/')[0], subject = s.study.find((x) => folderOf(x) === folder) || { title: folder, emoji: '' };
          f.wait(Promise.all([import(link(file)), import(link('kit/tests.js'))]).then(([mod, { isRight }]) => {
            const bank = mod[name];
            let n = (Math.imul(today + 1, 2654435761) >>> 0) % bank.count + 1, q = bank.make(n);
            for (let j = 0; j < 80 && (q.figure || q.clues || !['choice', 'text', 'number'].includes(q.answer.kind)); j++) { n = (n % bank.count) + 1; q = bank.make(n); }
            const a = q.answer, LETTERS = 'ABCDE', key = day(now), saved = f.read('fluentio.today');
            const done = saved && saved.day === key && saved.id === id && saved.n === n ? saved : null;
            const result = el('p', { className: 'qd-result' });
            const shown = () => (a.kind === 'choice' ? `(${LETTERS[a.correct]}) ${a.choices[a.correct]}` : a.kind === 'text' ? a.accept[0] : `${a.value.toLocaleString('en-US', { maximumFractionDigits: 3 })}${a.unit ? ' ' + a.unit : ''}`);
            const say = (right) => { result.className = `qd-result ${right ? 'good' : 'bad'}`; result.innerHTML = right ? '✓ Right! Nice one.' : `✗ Not quite. The answer is <b>${shown()}</b>.`; };
            let area;
            if (a.kind === 'choice') {
              area = el('div', { className: 'qd-choices' }, a.choices.map((c, i) => {
                const b = el('button', { type: 'button', className: 'qd-choice', onclick: () => answer(i) }, el('b', {}, `(${LETTERS[i]})`));
                b.append(html('span', '', c));
                return b;
              }));
            } else {
              const input = el('input', { type: 'text', className: 'input', placeholder: 'Your answer', autocomplete: 'off', spellcheck: false, onkeydown: (e) => { if (e.key === 'Enter') answer(input.value); } });
              area = el('div', { className: 'qd-type' }, input, a.unit ? el('span', { className: 'muted' }, a.unit) : null, el('button', { type: 'button', className: 'btn', onclick: () => answer(input.value) }, 'Check'));
            }
            const settle = (given, right) => {
              if (a.kind === 'choice') [...area.children].forEach((b, i) => { b.disabled = true; if (i === a.correct) b.classList.add('right'); else if (i === given) b.classList.add('wrong'); });
              else { const input = area.querySelector('input'); input.value = given ?? ''; input.readOnly = true; area.querySelector('button').disabled = true; }
              say(right);
            };
            function answer(given) {
              if (a.kind !== 'choice' && !String(given).trim()) return;
              const right = isRight(a, given);
              f.write('fluentio.today', { day: key, id, n, given, right });
              settle(given, right);
            }
            box.replaceChildren(head('spark', 'Question of the day'), el('p', { className: 'muted small' }, `${subject.emoji || ''} ${subject.title} · ${q.topic}`.trim()),
              html('p', 'qd-text', q.text), area, result, el('a', { className: 'qd-more', href: `${link(subject.link || folder + '/')}#${id}/${n}` }, 'See it with the working →'));
            if (a.kind === 'choice') {
              const kids = [...area.children];
              kids.forEach((b) => { b.style.width = 'max-content'; });
              area.style.setProperty('--w', `${Math.max(84, ...kids.map((b) => b.offsetWidth + 1))}px`);
              kids.forEach((b) => { b.style.width = ''; });
            }
            if (done) settle(done.given, done.right);
          }).catch(() => box.replaceChildren(head('spark', 'Question of the day'), el('p', { className: 'muted' }, 'Today’s question didn’t load. Try the subjects in Modules.'))));
          return box;
        },
        data: () => {
          const tables = items.filter((it) => it.kind === 'table'), size = (t) => (Array.isArray(t.rows) ? t.rows.length : 0);
          const sizes = tables.slice(0, 8).map(size), most = Math.max(1, ...sizes), rows = tables.reduce((n, t) => n + size(t), 0);
          return tile('', 'var(--good)', head('database', s.dataTitle, link('data/')),
            el('p', { className: 'muted' }, tables.length ? `${plural(tables.length, 'sheet')}, ${plural(rows, 'row')}` : 'No sheets yet. They go in your databases.'),
            tables.length
              ? el('div', { className: 'bars', 'aria-hidden': 'true' }, sizes.map((n, i) => { const bar = el('span', { style: `height:${Math.max(14, Math.round((100 * n) / most))}%` }); bar.style.setProperty('--n', i); return bar; }))
              : el('div', { className: 'row' }, button('New sheet', link('data/#new/table'))));
        },
        // Music: what's playing with its controls (or your newest songs to start one), carried along on every page
        music: () => {
          const box = tile(`music${featureMusic ? ' feature' : ''}`, 'var(--accent)', head('music', s.musicTitle, link('music/')), el('p', { className: 'muted' }, 'Loading your music…'));
          f.wait(import(link('kit/music/player.js')).then(async (player) => {
            const lib = await import(link('kit/music/library.js'));
            player.mount();
            let seek = null;
            const fill = () => {
              const cur = player.current(), all = lib.state.lib.songs, newest = [...all].sort((a, b) => (b.added || 0) - (a.added || 0)), feature = box.classList.contains('feature');
              const go = el('span', { className: 'tile-go' }, svg('arrow'));
              const top = el('a', { className: 'tile-head', href: link('music/') }, el('span', { className: 'tile-ic' }, svg('music')), el('span', {}, s.musicTitle), cur && !player.audio.paused ? el('span', { className: 'm-bars', 'aria-hidden': 'true' }, el('i'), el('i'), el('i'), el('i')) : null, go);
              const row = (x, list, i) => el('li', {}, el('button', { type: 'button', onclick: () => player.playList(list, i) }, lib.art(x, { size: 38 }), el('span', { className: 't' }, el('b', {}, x.title), el('small', {}, x.artist)), el('span', { className: 'pl' }, lib.svg('play', true))));
              if (!lib.state.conn && !all.length) {
                seek = null;
                return box.replaceChildren(top, el('p', { className: 'muted' }, 'Play your own songs here and on every page. They’re kept in your private Database repo on GitHub.'), el('div', { className: 'row' }, el('a', { className: 'btn', href: link('music/') }, svg('plus'), 'Set up Music')));
              }
              if (!all.length) { seek = null; return box.replaceChildren(top, el('p', { className: 'muted' }, lib.state.loading ? 'Loading your music…' : 'No songs yet. Drop some on Music’s page.'), el('div', { className: 'row' }, el('a', { className: 'btn', href: link('music/') }, lib.svg('upload'), 'Add songs'))); }
              const liked = all.filter((x) => x.liked);
              const buttons = el('div', { className: 'row' },
                el('button', { type: 'button', className: 'btn', onclick: () => player.playList(newest, 0) }, lib.svg('play', true), 'Play all'),
                el('button', { type: 'button', className: 'btn', onclick: () => player.playList(newest, Math.floor(Math.random() * newest.length), true) }, lib.svg('shuffle'), 'Shuffle'),
                liked.length ? el('button', { type: 'button', className: 'btn', onclick: () => player.playList(liked, 0) }, lib.svg('heart'), `Liked · ${liked.length}`) : null);
              if (cur) {
                seek = player.seeker();
                const now = el('div', { className: 'now' }, el('div', { className: 'm-tile-now' }, lib.art(cur, { size: feature ? 132 : 76 }), el('div', { className: 't' }, el('b', {}, cur.title), el('span', {}, cur.artist + (cur.album ? ` · ${cur.album}` : '')), seek.box)), player.controls());
                const next = player.upNext().slice(0, feature ? 4 : 3);
                const side = el('div', { className: 'side' }, el('h3', {}, next.length ? 'Up next' : 'Newest'), el('ul', { className: 'm-mini' }, (next.length ? next : newest.slice(0, feature ? 4 : 3)).map((x) => row(x, next.length ? [x] : newest, next.length ? 0 : newest.indexOf(x)))));
                if (next.length) side.querySelectorAll('.m-mini button').forEach((b, i) => { b.onclick = () => player.jump(player.position() + 1 + i); });
                return box.replaceChildren(...[top, now, side, feature ? buttons : null].filter(Boolean));
              }
              seek = null;
              box.replaceChildren(top, el('p', { className: 'muted small' }, `${lib.plural(all.length, 'song')} · ${lib.total(all)}`),
                el('div', { className: 'side' }, el('h3', {}, 'Newest'), el('ul', { className: 'm-mini' }, newest.slice(0, feature ? 5 : 4).map((x, i) => row(x, newest, i)))), buttons);
            };
            fill();
            for (const w of ['song', 'state', 'queue']) player.events.addEventListener(w, fill);
            player.events.addEventListener('time', () => seek?.paint());
            let seen = '';   // (the same library again changes nothing)
            lib.events.addEventListener('library', () => { const now = JSON.stringify([lib.state.lib, !!lib.state.conn, lib.state.loading && !lib.state.lib.songs.length]); if (now !== seen) { seen = now; fill(); } });
            lib.refresh();   // (the newest library, in case another device added songs)
          }).catch(() => box.replaceChildren(head('music', s.musicTitle, link('music/')), el('p', { className: 'muted' }, 'Music didn’t load here. Open it from the bar.'))));
          return box;
        },
        quick: () => tile('quick', 'var(--plot2)', head('bolt', 'Quick'),
          el('div', { className: 'row' }, s.quick.filter((q) => q.link && (f.spacesOn || !/^(data|code|notes|workspace)\//.test(link(q.link).slice(f.root.length)))).map((q) => {
            const a = el('a', { className: 'btn', href: link(q.link) }, q.title || q.link);
            if (!link(q.link).startsWith(f.root)) { a.target = '_blank'; a.rel = 'noopener'; }
            return a;
          }))),
      };
      // (while Data, Code and Notes are off, so are Recent, Data and the Quick buttons into them)
      if (!f.spacesOn) { delete TILES.workspace; delete TILES.data; }
      // which tiles: as many as fit in one row (three, two on a smaller screen, one on a phone), picked by what you've
      // been doing (Auto), or in the order of the layout chosen in Settings → Home; the rest wait under them, a click away
      const main = document.querySelector('main');
      document.documentElement.classList.add('home-fit');
      main.className = `layout-${layout} anchor-${['left', 'right'].includes(s.homeAlign) ? s.homeAlign : 'center'}`;
      document.body.classList.toggle('calm', layout === 'calm');
      const mode = ['classic', 'study', 'music', 'calm'].includes(s.homeLayout) ? s.homeLayout : 'auto';
      const evening = hourNow >= 18 || hourNow < 5, morning = hourNow >= 5 && hourNow < 12;
      const studied = f.last(), sinceStudy = studied?.at ? (now - studied.at) / 86400000 : Infinity, answered = (f.read('fluentio.today') || {}).day === day(now);
      // how much each tile matters now: what's playing or what you learned last counts most, the time of day a little
      const SCORE = {
        music: (music?.playing ? 100 : on ? 72 : songs.length ? 48 : 12) + (evening ? 22 : 0),
        study: (sinceStudy <= 3 ? 90 : sinceStudy <= 14 ? 62 : 40) + (morning ? 10 : 0),
        question: (answered ? 14 : 66) + (morning ? 8 : 0),
        progress: learned || bests ? 46 + Math.min(visits.streak || 0, 10) : 8,
        today: 30, quick: 24, workspace: items.length ? 58 : 4, data: 4,
      };
      const allowed = s.home.filter((k, i, all) => TILES[k] && all.indexOf(k) === i);
      const order = mode === 'auto' ? [...allowed].sort((a, b) => (SCORE[b] || 0) - (SCORE[a] || 0))
        : mode === 'classic' ? allowed : LAYOUTS[mode].filter((k) => allowed.includes(k));
      let featureMusic = false, shown = [];
      const TILE_ICON = { music: 'music', study: 'study', progress: 'chart', today: 'calendar', question: 'spark', quick: 'bolt', workspace: 'clock', data: 'database' };
      const NAME = { music: s.musicTitle, study: s.studyTitle, progress: 'Your progress', today: 'Today', question: 'Question of the day', quick: 'Quick', workspace: 'Recent', data: s.dataTitle };
      const fit = (list) => {
        const cols = matchMedia('(min-width: 900px)').matches ? 3 : matchMedia('(min-width: 561px)').matches ? 2 : 1, out = [];
        featureMusic = cols === 3 && list[0] === 'music' && (layout === 'music' || layout === 'calm' || (mode === 'auto' && music?.playing && evening));
        let used = 0;
        for (const k of list) { const w = k === 'music' && featureMusic ? 2 : 1; if (used + w <= cols) { out.push(k); used += w; } }
        $('tiles').style.setProperty('--cols', cols);
        return out;
      };
      const draw = (list) => {
        shown = fit(list);
        $('tiles').replaceChildren(...shown.map((k) => TILES[k]()));
        const rest = order.filter((k) => !shown.includes(k));
        $('layouts').replaceChildren(rest.length ? el('div', { className: 'also' }, 'Also:', rest.map((k) => el('button', { type: 'button', className: 'chip', title: `Show ${NAME[k]} here`, onclick: () => draw([k, ...shown.filter((x) => x !== k)]) }, svg(TILE_ICON[k] || 'plus'), NAME[k] || k))) : '');
      };
      draw(order);
      for (const q of ['(min-width: 900px)', '(min-width: 561px)']) matchMedia(q).addEventListener('change', () => draw(shown.length ? [...shown, ...order.filter((k) => !shown.includes(k))] : order));
      if (layout === 'calm') {
        const tick = () => { $('clock').textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); };
        tick(); $('clock').hidden = false; setInterval(tick, 15000);
      }
    }
  </script>
