<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Journal · Fluence</title>
  <meta name="description" content="A few lines a day: what you did, what you learned, what’s on your mind.">
  <script src="../settings.js"></script>
  <script src="../kit/look.js"></script>
  <script src="../kit/bar.js"></script>
  <link rel="modulepreload" href="app.js">
  <link rel="stylesheet" href="../kit/site.css">
  <link rel="stylesheet" href="../kit/tests.css">
  <style>
    /* the day you're writing, then the days before it */
    .j-day { padding: 22px clamp(16px, 4vw, 30px) 18px; background: var(--card); border: 1px solid var(--line); border-radius: calc(var(--radius) + 8px); animation: rise var(--t3) var(--ease) backwards; animation-delay: calc(160ms / var(--speed)); }
    .j-date { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 14px; margin: 0 0 4px; }
    .j-date h2 { margin: 0; font-size: 1.35rem; letter-spacing: -0.01em; }
    .j-date a { font-size: .92rem; }
    .j-ask { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; margin: 0 0 12px; color: var(--muted); font-style: italic; }
    .j-ask button { padding: 0; font: inherit; font-size: .88rem; font-style: normal; color: var(--accent); cursor: pointer; background: none; border: 0; }
    .j-text { display: block; width: 100%; min-height: 42vh; padding: 0; font: inherit; font-size: 1.08rem; line-height: 1.75; color: var(--text); background: transparent; border: 0; outline: none; resize: none; overflow: hidden; }
    .j-text::placeholder { color: color-mix(in srgb, var(--muted) 75%, transparent); }
    .j-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-top: 10px; padding-top: 10px; color: var(--muted); font-size: .88rem; border-top: 1px solid var(--line); }
    .j-grow { flex: 1; }
    .j-from { margin: 18px 0 0; }
    .j-from h3 { margin: 0 0 8px; }
    .j-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .j-chip { padding: 5px 11px; font: inherit; font-size: .88rem; color: var(--text); text-align: left; cursor: pointer; background: color-mix(in srgb, var(--accent) 9%, var(--card)); border: 1px solid var(--line); border-radius: 999px; transition: border-color var(--t1), transform var(--t2) var(--spring); }
    .j-chip:hover { border-color: var(--accent); transform: translateY(-1px); }
    .j-chip.used { color: var(--muted); background: transparent; }
    .j-past { margin-top: 34px; animation: rise var(--t3) var(--ease) backwards; animation-delay: calc(240ms / var(--speed)); }
    .j-past-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 14px; margin-bottom: 4px; }
    .j-past-top h2 { margin: 0; font-size: 1.15rem; }
    .j-search { width: min(100%, 260px); }
    .j-month { margin: 18px 0 8px; }
    .j-rows { display: grid; gap: 6px; }
    .j-row { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; align-items: baseline; gap: 12px; padding: 10px 14px; color: inherit; text-decoration: none; background: var(--card); border: 1px solid var(--line); border-radius: calc(var(--radius) + 2px); transition: border-color var(--t1), transform var(--t2) var(--spring); }
    .j-row:hover { border-color: var(--accent); transform: translateX(3px); }
    .j-row.on { border-color: var(--accent); }
    .j-row b { font-weight: 600; white-space: nowrap; }
    .j-row span { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--muted); }
    .j-row small { color: var(--muted); white-space: nowrap; }
    .j-none { color: var(--muted); }
    @media (max-width: 560px) { .j-row { grid-template-columns: minmax(0, 1fr) auto; } .j-row span { grid-column: 1 / -1; grid-row: 2; } }
  </style>
</head>
<body data-title="Journal">
  <script>window.fluentio?.bar?.()</script>
  <main>
    <header id="top">
      <a class="back" href="../study/">← <span data-fill="studyTitle">Modules</span></a>
      <h1>📓 Journal</h1>
      <p class="lead">A few lines a day: what you did, what you learned, what’s on your mind. It’s saved as you type, in this browser, and with your progress in your private Database repo once you’ve connected one.</p>
    </header>
    <div id="stage"><noscript>The journal needs JavaScript.</noscript></div>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
