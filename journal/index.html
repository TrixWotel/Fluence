<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Station · Fluence</title>
  <!-- (Journal is part of Station now: journal/ goes to today's entry there, and journal/#2026-11-06 to that day's) -->
  <script>
    const day = decodeURIComponent(location.hash.slice(1));
    location.replace(new URL(`../station/#${/^\d{4}-\d{2}-\d{2}$/.test(day) ? `journal/${day}` : 'today'}`, location.href).href);
  </script>
</head>
<body>
  <p><a href="../station/#today">Your journal is in Station now.</a></p>
</body>
</html>
