<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Station · Fluence</title>
  <meta name="description" content="An endless whiteboard, saved in your private repo on GitHub.">
  <script type="importmap">{ "imports": { "react": "https://esm.sh/react@19.0.0", "react/jsx-runtime": "https://esm.sh/react@19.0.0/jsx-runtime", "react-dom": "https://esm.sh/react-dom@19.0.0", "react-dom/client": "https://esm.sh/react-dom@19.0.0/client" } }</script>
  <script>window.EXCALIDRAW_ASSET_PATH = 'https://esm.sh/@excalidraw/excalidraw@0.18.1/dist/prod/';</script>
  <script src="../settings.js"></script>
  <script src="../kit/look.js"></script>
  <script src="../kit/bar.js"></script>
  <link rel="stylesheet" href="../kit/site.css">
  <link rel="stylesheet" href="https://esm.sh/@excalidraw/excalidraw@0.18.1/dist/prod/index.css">
  <style>
    /* the board takes the whole window under the bar (and above the player, when there is one), on the site's own background */
    html, body { overflow: hidden; }
    #board { position: fixed; top: var(--bar-h); left: 0; right: 0; bottom: 0; --st-bottom: 16px; }
    html.has-player { --st-bottom: calc(var(--player-h, 78px) + 26px); }
    .excalidraw, .excalidraw .excalidraw-container { background: transparent !important; }
    /* Excalidraw's own interface stays out of sight: this page has its own */
    html:not(.st-full) .excalidraw :is(.layer-ui__wrapper, .App-top-bar, .App-bottom-bar, .FixedSideContainer, .scroll-back-to-content) { display: none !important; }
    .excalidraw .LoadingMessage { display: none; }
    /* what you select and drag, in the theme's color (station/app.js works it out) */
    .excalidraw { --color-selection: var(--st-selection, var(--accent)) !important; }
    .st-bar, .st-tray { position: fixed; z-index: 5; left: 50%; transform: translateX(-50%); background: color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--line); box-shadow: var(--shadow); }
    .st-bar { bottom: var(--st-bottom, 14px); display: flex; align-items: center; gap: 1px; padding: 4px; border-radius: 14px; max-width: calc(100vw - 16px); }
    .st-bar[hidden], .st-tray[hidden], .st-chip[hidden] { display: none; }
    .st-tool { display: grid; place-items: center; flex: none; width: 32px; height: 32px; padding: 0; color: var(--muted); cursor: pointer; background: transparent; border: 0; border-radius: 10px; transition: color var(--t1), background var(--t1); }
    .st-tool:hover { color: var(--text); background: color-mix(in srgb, var(--text) 8%, transparent); }
    .st-tool.on { color: var(--on-accent); background: var(--accent); }
    .st-gap { flex: none; width: 1px; height: 16px; margin: 0 4px; background: var(--line); }
    /* one row of styles */
    .st-tray { bottom: calc(var(--st-bottom, 14px) + 48px); display: flex; align-items: center; gap: 3px; padding: 4px 7px; border-radius: 12px; width: max-content; max-width: calc(100vw - 16px); }
    .st-dot { flex: none; width: 18px; height: 18px; margin: 0 1px; padding: 0; cursor: pointer; background: var(--dot); border: 0; border-radius: 50%; outline: 2px solid transparent; outline-offset: 1px; transition: transform var(--t1); }
    html.st-dark .st-dot { filter: invert(93%) hue-rotate(180deg); }
    .st-dot:hover { transform: scale(1.12); }
    .st-dot.on { outline-color: var(--accent); }
    html.st-dark .st-dot.on { outline-color: color-mix(in srgb, var(--accent) 60%, #000); }
    .st-chip { display: grid; place-items: center; flex: none; min-width: 26px; height: 26px; padding: 0 5px; font: inherit; font-size: .76rem; font-weight: 600; color: var(--muted); cursor: pointer; background: transparent; border: 0; border-radius: 8px; transition: color var(--t1), background var(--t1); }
    .st-chip:hover { color: var(--text); background: color-mix(in srgb, var(--text) 8%, transparent); }
    .st-chip.on { color: var(--text); background: color-mix(in srgb, var(--accent) 22%, transparent); }
    .st-chip svg { width: 15px; height: 15px; }
    /* how saving is going: a small dot that fades, and words only if there's something you should know */
    .st-status { position: fixed; z-index: 5; right: 14px; top: calc(var(--bar-h) + 10px); max-width: min(72vw, 460px); padding: 2px 4px; font-size: .78rem; line-height: 1.5; color: var(--muted); text-align: right; pointer-events: none; }
    .st-status a { pointer-events: auto; color: var(--accent); }
    html.st-full .st-status { top: calc(var(--bar-h) + 62px); }
    .st-status.busy, .st-status.done { font-size: 0; }
    .st-status.busy::after, .st-status.done::after { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
    .st-status.done::after { background: var(--good); animation: st-fade 2.2s var(--ease) forwards; }
    @keyframes st-fade { 0%, 50% { opacity: 1; } 100% { opacity: 0; } }
    .st-status.bad { color: var(--bad); }
    .st-failed { display: grid; place-content: center; justify-items: center; gap: 12px; height: 100%; color: var(--muted); }
  </style>
</head>
<body data-title="Station">
  <script>window.fluentio?.bar?.()</script>
  <div id="board"></div>
  <div id="status" class="st-status" role="status"></div>
  <div id="tray" class="st-tray" hidden></div>
  <div id="tools" class="st-bar" role="toolbar" aria-label="Drawing tools" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
