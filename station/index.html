<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Station · Fluence</title>
  <meta name="description" content="An endless whiteboard, saved in your private repo on GitHub.">
  <script type="importmap">{ "imports": { "react": "https://esm.sh/react@19.0.0", "react/jsx-runtime": "https://esm.sh/react@19.0.0/jsx-runtime", "react-dom": "https://esm.sh/react-dom@19.0.0", "react-dom/client": "https://esm.sh/react-dom@19.0.0/client" } }</script>
  <script>window.EXCALIDRAW_ASSET_PATH = 'https://esm.sh/@excalidraw/excalidraw@0.18.1/dist/prod/';</script>
  <script src="../settings.js"></script>
  <script src="../kit/look.js"></script>
  <script src="../kit/bar.js"></script>
  <link rel="stylesheet" href="../kit/site.css">
  <link rel="stylesheet" href="https://esm.sh/@excalidraw/excalidraw@0.18.1/dist/prod/index.css">
  <style>
    /* the board takes the whole window under the bar (and above the player, when there is one), on the site's own background */
    html, body { overflow: hidden; }
    #board { position: fixed; top: var(--bar-h); left: 0; right: 0; bottom: 0; --st-bottom: 16px; }
    html.has-player { --st-bottom: calc(var(--player-h, 78px) + 26px); }
    .excalidraw, .excalidraw .excalidraw-container { background: transparent !important; }
    /* Excalidraw's own interface stays out of sight: this page has its own */
    html:not(.st-full) .excalidraw :is(.layer-ui__wrapper, .App-top-bar, .App-bottom-bar, .FixedSideContainer, .scroll-back-to-content) { display: none !important; }
    .st-bar, .st-tray, .st-more, .st-simple { position: fixed; z-index: 5; left: 50%; transform: translateX(-50%); background: color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--line); box-shadow: var(--shadow); }
    .st-bar { bottom: var(--st-bottom, 16px); display: flex; align-items: center; gap: 2px; padding: 5px; border-radius: 16px; max-width: calc(100vw - 16px); }
    .st-bar[hidden], .st-tray[hidden], .st-more[hidden], .st-simple[hidden], .st-group[hidden], .st-hint[hidden] { display: none; }
    /* back from all of Excalidraw's tools */
    .st-simple { bottom: var(--st-bottom, 16px); padding: 6px 14px; font: inherit; font-size: .86rem; color: var(--text); cursor: pointer; border-radius: 999px; }
    .st-tool { display: grid; place-items: center; width: 36px; height: 36px; color: var(--muted); cursor: pointer; background: transparent; border: 0; border-radius: 11px; transition: color var(--t1), background var(--t1); }
    .st-tool:hover { color: var(--text); background: color-mix(in srgb, var(--text) 8%, transparent); }
    .st-tool.on { color: var(--on-accent); background: var(--accent); }
    .st-gap { flex: none; width: 1px; height: 18px; margin: 0 4px; background: var(--line); }
    .st-tray { bottom: calc(var(--st-bottom, 16px) + 56px); display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 10px; padding: 6px 10px; border-radius: 14px; width: max-content; max-width: calc(100vw - 16px); }
    .st-group { display: flex; align-items: center; gap: 3px; }
    .st-group + .st-group:not([hidden]) { padding-left: 10px; border-left: 1px solid var(--line); }
    .st-pill { display: grid; place-items: center; min-width: 28px; height: 26px; padding: 0 6px; font: inherit; font-size: .78rem; font-weight: 600; color: var(--muted); cursor: pointer; background: transparent; border: 0; border-radius: 8px; }
    .st-pill:hover { color: var(--text); }
    .st-pill.on { color: var(--text); background: color-mix(in srgb, var(--accent) 22%, transparent); }
    .st-pill svg { width: 16px; height: 16px; }
    .st-fill.none { background: linear-gradient(135deg, transparent 45%, var(--bad) 45% 55%, transparent 55%); filter: none !important; }
    .st-hint { flex: 0 0 100%; width: 0; font-size: .78rem; line-height: 1.3; color: var(--muted); text-align: center; }
    .st-dot { width: 22px; height: 22px; padding: 0; cursor: pointer; background: var(--dot); border: 2px solid transparent; border-radius: 50%; background-clip: padding-box; outline: 1px solid var(--line); outline-offset: 0; transition: transform var(--t1); }
    html.st-dark .st-dot { filter: invert(93%) hue-rotate(180deg); }
    .st-dot:hover { transform: scale(1.12); }
    .st-dot.on { outline: 2px solid var(--accent); outline-offset: 1px; }
    .st-size { display: grid; place-items: center; width: 28px; height: 26px; padding: 0; cursor: pointer; background: transparent; border: 0; border-radius: 8px; }
    .st-size i { display: block; width: 15px; border-radius: 3px; background: var(--muted); }
    .st-size:hover i { background: var(--text); }
    .st-size.on { background: color-mix(in srgb, var(--accent) 22%, transparent); }
    .st-size.on i { background: var(--text); }
    .st-more { bottom: calc(var(--st-bottom, 16px) + 56px); left: auto; right: max(12px, calc(50vw - 235px)); transform: none; display: grid; min-width: 200px; padding: 5px; border-radius: 14px; }
    .st-more button { padding: 8px 11px; font: inherit; font-size: .92rem; color: var(--text); text-align: left; cursor: pointer; background: transparent; border: 0; border-radius: 9px; }
    .st-more button:hover { background: color-mix(in srgb, var(--text) 8%, transparent); }
    .st-more .st-danger { color: var(--bad); }
    /* how saving is going: a quiet word that fades, unless there's something you should know */
    .st-status { position: fixed; z-index: 5; right: 14px; top: calc(var(--bar-h) + 10px); max-width: min(72vw, 460px); padding: 2px 10px; font-size: .8rem; line-height: 1.5; color: var(--muted); text-align: right; pointer-events: none; }
    .st-status a { pointer-events: auto; color: var(--accent); }
    html.st-full .st-status { top: calc(var(--bar-h) + 62px); }
    .st-status.done { animation: st-fade 2.6s var(--ease) forwards; }
    @keyframes st-fade { 0%, 60% { opacity: 1; } 100% { opacity: 0; } }
    .st-status.bad { color: var(--bad); }
    .st-failed { display: grid; place-content: center; justify-items: center; gap: 12px; height: 100%; color: var(--muted); }
    @media (max-width: 560px) { .st-group + .st-group:not([hidden]) { padding-left: 0; border-left: 0; } .st-tool { width: 28px; height: 32px; } .st-tool svg { width: 16px; height: 16px; } .st-tool[aria-label^="Move"], .st-tool[aria-label="Redo"], .st-tool[aria-label^="Line"] { display: none; } .st-gap { margin: 0 1px; } .st-more { right: 8px; } }
  </style>
</head>
<body data-title="Station">
  <script>window.fluentio?.bar?.()</script>
  <div id="board"></div>
  <div id="status" class="st-status" role="status"></div>
  <div id="tray" class="st-tray" hidden></div>
  <div id="more" class="st-more" hidden></div>
  <div id="tools" class="st-bar" role="toolbar" aria-label="Drawing tools" hidden></div>
  <button id="simple" type="button" class="st-simple" hidden>Back to the simple tools</button>
  <script type="module" src="app.js"></script>
</body>
</html>
