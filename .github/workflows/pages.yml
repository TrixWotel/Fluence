# Puts the whole site online: space is the main page (with kit/, the test runner the Math, Science, Physics, Spanish and History
# tests share), and each other branch is served in its own folder: /geography, /math, /science, /physics, /spanish, /history and
# /english. It runs from this branch, the one the site's deploy rules allow. A push to any other branch only asks this one to
# deploy (that's what their copy of this file does), so a new subject needs adding here and nowhere else.
name: Deploy the site

on:
  push:
    branches: [space]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time, and none cancelled halfway
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get the main page (space branch)
        uses: actions/checkout@v7
        with:
          ref: space
          path: main

      - name: Get the geography tests (geography branch)
        uses: actions/checkout@v7
        with:
          ref: geography
          path: geography

      - name: Get the math tests (math branch)
        uses: actions/checkout@v7
        with:
          ref: math
          path: math

      - name: Get the science tests (science branch)
        uses: actions/checkout@v7
        with:
          ref: science
          path: science

      - name: Get the physics tests (physics branch)
        uses: actions/checkout@v7
        with:
          ref: physics
          path: physics

      - name: Get the Spanish tests (spanish branch)
        uses: actions/checkout@v7
        with:
          ref: spanish
          path: spanish

      - name: Get the history tests (history branch)
        uses: actions/checkout@v7
        with:
          ref: history
          path: history

      - name: Get the English module (english branch)
        uses: actions/checkout@v7
        with:
          ref: english
          path: english

      - name: Put the site together
        run: |
          mkdir -p _site
          cp -R main/. _site/
          for b in geography math science physics spanish history english; do mkdir -p "_site/$b" && cp -R "$b/." "_site/$b/"; done
          for d in _site _site/geography _site/math _site/science _site/physics _site/spanish _site/history _site/english; do rm -rf "$d/.git" "$d/.github" "$d/README.md" "$d/LICENSE"; done
          find _site -type f | sort

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
