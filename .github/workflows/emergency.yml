# Takes the one-day AMC 10 lesson down just after midnight in New York on November 5, 2026: deletes its files from the
# math branch and its links from the math and space branches, puts the site online again, then turns itself off. (The
# page and its links hide themselves at midnight anyway, so a late run only delays the files going.) Pushing this file
# tries it all without saving anything, to catch a mistake while there's still time.
name: Take down the AMC 10 lesson

on:
  schedule:
    - cron: '10 5 5 11 *'
  push:
    branches: [space]
    paths: ['.github/workflows/emergency.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  take-down:
    runs-on: ubuntu-latest
    steps:
      - name: Get the math branch
        uses: actions/checkout@v7
        with:
          ref: math
          path: math

      - name: Get the space branch
        uses: actions/checkout@v7
        with:
          ref: space
          path: space

      - name: Delete the lesson and its links
        run: |
          git -C math rm -q emergency.html emergency.js emergency-lessons.js
          sed -i '/emergency-lesson/d' math/index.html space/index.html
          ! grep -n 'emergency' math/index.html space/index.html
          git -C math add index.html
          git -C space add index.html
          git -C math status --short
          git -C space status --short

      - name: Save it (a push of this file only tries)
        run: |
          [ "$GITHUB_EVENT_NAME" = push ] && try=--dry-run || try=
          for b in math space; do
            git -C "$b" -c user.name=TrixWotel -c user.email=310347729+TrixWotel@users.noreply.github.com commit -q -m "The one-day AMC 10 lesson is over"
            git -C "$b" push $try origin "HEAD:$b"
          done

      - name: Put the site online again, and turn this off
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref space
          gh workflow disable emergency.yml --repo "$GITHUB_REPOSITORY"
